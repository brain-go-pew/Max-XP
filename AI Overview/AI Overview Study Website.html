ful patterns:<\/b> suggested prompts, editable outputs, undo and confirmation before irreversible actions, memory controls, feedback buttons. Agents fail ~1 in 3 structured tasks, so a travel agent AI should <b>stop and show a summary<\/b> (dates, price, card) before paying.<\/p>\n\n<h3>10.5 Accessibility<\/h3>\n<p>AI turns one kind of information into another: <b>vision<\/b> (describing photos, screens), <b>hearing<\/b> (live captions), <b>speech/motor<\/b> (voice control, non-standard speech), <b>cognitive<\/b> (simplifying, reading aloud), <b>language<\/b> (real-time translation).<\/p>\n<div class=\"ex\"><b>Be My Eyes \"Be My AI\" (2023)<\/b>, built on OpenAI's GPT-4 vision: blind and low-vision users take a photo and get a spoken description, then ask follow-ups. In beta, <b>16,000<\/b> users requested ~<b>25,000<\/b> descriptions a day. Now used in Microsoft's Disability Answer Desk and on Windows.<\/div>\n<p><b>Risks:<\/b> errors no one can catch (Be My Eyes keeps human volunteers), inaccessible AI tools, and privacy of photos. Build <i>with<\/i> disabled users, keep a human fallback, state uncertainty.<\/p>\n\n<h3>10.6 Effects on people<\/h3>\n<p><b>Critical thinking<\/b> (Microsoft Research + Carnegie Mellon, CHI 2025): <b>319<\/b> knowledge workers, 936 tasks. More confidence in AI → <b>less<\/b> critical thinking; more confidence in own skills → more checking. Work shifted from doing to <b>overseeing<\/b>; people struggled to evaluate AI outside their expertise, and results were less diverse.<\/p>\n<p><b>Emotional reliance<\/b> (OpenAI + MIT Media Lab, March 2025): ~40 million interactions plus a 28-day trial with <b>981<\/b> people. Emotional chats were rare, concentrated in heavy voice users. Brief voice use linked to better well-being; heavy daily use linked to more <b>loneliness<\/b> and dependence (<b>correlation<\/b>, not proof).<\/p>\n<p>Responsible design avoids maximizing engagement for its own sake. <i>Example:<\/i> one student lets AI write every outline and loses practice; another asks AI to critique their own outline and improves faster.<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 10.1 · Design check<\/b><\/p><p>Pick an AI feature you use (autocomplete, an AI Overview, a voice assistant). Score it 0–2 on each Microsoft stage: initially, during interaction, when wrong, over time.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Write one change that would improve its lowest score.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 10.2 · Think first, then ask (cognitive forcing)<\/b><\/p><p>Answer three questions from this guide's test bank yourself first, then ask a chatbot the same questions. Note when you changed your answer and whether the change was right.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> This is the design that cut overreliance most in research.<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>People mostly use AI as an advisor: asking, information, writing.<\/li>\n<li>Design for the AI being wrong; aim for calibrated, not maximum, trust.<\/li>\n<li>The more AI acts alone, the more humans need control.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>Mental model<\/dt><dd>A user's understanding of how a system works.<\/dd>\n<dt>Calibrated trust<\/dt><dd>Trusting AI exactly as much as it deserves.<\/dd>\n<dt>Automation bias<\/dt><dd>Over-relying on automated suggestions, even when wrong.<\/dd>\n<dt>Cognitive forcing<\/dt><dd>Design that makes users think before accepting AI output.<\/dd>\n<dt>Cognitive offloading<\/dt><dd>Letting a tool do thinking you would otherwise do.<\/dd>\n<dt>Affective use<\/dt><dd>Using AI for emotional or social purposes.<\/dd>\n<\/dl><\/div>","q":[["mc","According to NBER, what share of ChatGPT messages are non-work?",["70%+","About 4%","100%","About 40%"],0,"Up from 53%."],["mc","At work, what is the leading ChatGPT use?",["Image generation","Writing, mostly editing the user's own text","Coding","Shopping"],1,"Writing ~40%; coding only ~4%."],["mc","Which Microsoft guideline phase covers \"easy to dismiss and correct\"?",["During","When wrong","Over time","Initially"],1,"Plan for the AI being wrong and make recovery easy."],["mc","Accepting AI output without checking is called:",["Undertrust","Sycophancy","Automation bias (overtrust)","Cognitive forcing"],2,"Overtrust."],["mc","Which design cut overreliance the most but was liked least?",["Cognitive forcing","Explanations","Disclosure labels","Confidence scores"],0,"Answer first, then see the AI."],["mc","What should a travel-booking AI agent do before paying?",["Ask another AI","Hide the price","Stop and show a summary (dates, price, card) for approval","Pay immediately to save time"],2,"Agents fail about a third of structured tasks."],["mc","The Microsoft + CMU study of 319 workers found:",["AI always improves thinking","Workers stopped using AI","More trust in AI → less critical thinking","No effect"],2,"Confidence in one's own skills meant more checking."],["mc","How many design recommendations were Microsoft's 18 guidelines condensed from?",["18","150+","936","49"],1,"Tested with 49 designers on 20 AI products."],["mc","Which is a chapter of Google PAIR's People + AI Guidebook?",["SLAM","Pay-per-crawl","Keyword stuffing","Mental models"],3,"Others: user needs, data, explainability + trust, feedback + control, errors + graceful failure."],["mc","The 2026 AAAI study found users were more likely to:",["Ignore confidence scores","Accept high-confidence AI recommendations even when wrong","Click every citation","Reject all AI advice"],1,"And reject accurate low-confidence ones."],["mc","What is the \"blank-box problem\" in chat interfaces?",["The AI won't reply","The screen goes blank","Users must know what to ask","Answers have no sources"],2,"Suggested prompts and examples help."],["mc","In the Microsoft + CMU study, where did people find AI hardest to evaluate?",["In images only","In areas where they lacked expertise","In their own field","In math only"],1,"AI users also produced less diverse results."],["mc","How many ChatGPT interactions did the OpenAI + MIT study analyze?",["About 700 million","About 18 billion","About 981","About 40 million"],3,"Plus a 28-day trial with 981 participants."],["tf","Adding explanations to AI answers always reduces blind trust.",false,"Explanations can increase blind trust."],["tf","Voice interfaces make it hard to show sources.",true,"Hands-free and accessible, but citations are hard to present."],["tf","Be My Eyes keeps human volunteers available as a fallback to Be My AI.",true,"Blind users may not be able to catch a wrong description."],["sa","Design an AI shopping agent's checkout so users keep calibrated trust. Use at least two design guidelines.","Before paying, the agent stops and shows a clear summary (item, price, card, delivery) requiring approval; makes it easy to cancel or correct; explains why it picked the item and cites sources; states up front what it can and cannot do; notifies the user of changes. These follow Microsoft's 'initially' and 'when wrong' guidelines."],["sa","Explain why explanations and confidence scores do not always produce calibrated trust.","Explanations can make people accept AI advice more often whether or not it is right, because they read an explanation as a sign of competence. Confidence scores lead users to accept wrong high-confidence answers and reject correct low-confidence ones. So trust signals must actually change behavior, e.g. with cognitive forcing or friction matched to the stakes."]]},{"n":11,"title":"AI Ethics & Social Responsibility","sum":"How AI should be built and used so it benefits people and avoids harm: who it helps, who it might hurt, and who is responsible when something goes wrong.","html":"<h3>11.1 The global baseline<\/h3>\n<p>In November 2021, all <b>193<\/b> UNESCO member states adopted the <b>Recommendation on the Ethics of AI<\/b>, the first global standard. It isn't legally binding, but countries report on how they apply it. It has 10 core principles and actions in 11 policy areas.<\/p>\n<table class=\"tbl\"><tr><th>Principle<\/th><th>Plain meaning<\/th><\/tr>\n<tr><td>Fairness / non-discrimination<\/td><td>No unfair treatment of groups<\/td><\/tr>\n<tr><td>Transparency / explainability<\/td><td>People know when AI is used and roughly how it decides<\/td><\/tr>\n<tr><td>Privacy / data protection<\/td><td>Personal data used lawfully and minimally<\/td><\/tr>\n<tr><td>Safety / security<\/td><td>Works reliably and resists misuse<\/td><\/tr>\n<tr><td>Accountability<\/td><td>A human or organization stays responsible<\/td><\/tr>\n<tr><td>Human oversight<\/td><td>People can review, override or appeal<\/td><\/tr>\n<tr><td>Sustainability<\/td><td>Energy, water and environmental costs<\/td><\/tr><\/table>\n<p>Principles are easy to agree on and hard to apply.<\/p>\n\n<h3>11.2 Bias and fairness<\/h3>\n<p>Cases: <b>Gender Shades<\/b> (34.7% vs 0.8% errors) and <b>Amazon hiring<\/b> (downgraded \"women's\") — see Topic 9. Ethical questions:<\/p>\n<ul>\n<li><b>Whose data?<\/b> Who was left out, and who decided?<\/li>\n<li><b>Which fairness?<\/b> Equal accuracy, equal approval rates, or equal error rates? They can conflict, so choosing is a <b>value judgment<\/b>.<\/li>\n<li><b>Should AI be used here at all?<\/b> Predicting crime or emotions from faces may be too risky regardless of accuracy.<\/li>\n<\/ul>\n<p><b>Responses:<\/b> per-group testing, representative data, independent bias audits (<b>NYC Local Law 144<\/b> requires them for AI hiring tools), and treating hiring, credit and education AI as high-risk (EU AI Act).<\/p>\n\n<h3>11.3 Misinformation and deepfakes<\/h3>\n<p>Three harms: <b>fraud and scams<\/b> (impersonating faces and voices), <b>misinformation<\/b> (fake news, election manipulation, AI errors spread as fact), <b>personal abuse<\/b> (non-consensual intimate images, harassment).<\/p>\n<div class=\"ex\"><b>Arup (2024).<\/b> A finance employee in Arup's Hong Kong office joined a video call with what looked like the UK CFO and colleagues. <b>Everyone else was a deepfake<\/b> built from public video and audio. He made <b>15 transfers<\/b> totaling HK$200 million (~<b>US$25.6 million<\/b>) to five accounts, discovered only when he checked with head office.<\/div>\n<ul>\n<li><b>Labeling:<\/b> China requires visible labels + hidden metadata (since <b>Sept 2025<\/b>); EU AI Act Article 50 transparency rules (since <b>Aug 2026<\/b>).<\/li>\n<li><b>Targeted laws:<\/b> US <b>TAKE IT DOWN Act<\/b> (May 2025) criminalizes sharing non-consensual intimate deepfakes; EU bans on \"nudifier\" apps and AI child abuse material.<\/li>\n<li><b>Habits:<\/b> call back on a known number, code words, two-person payment approval.<\/li>\n<\/ul>\n<p>When anything can be faked, people may stop trusting real evidence too: the <b>\"liar's dividend.\"<\/b><\/p>\n\n<h3>11.4 Privacy, data and copyright<\/h3>\n<p><b>Privacy concerns:<\/b> personal data in training sets without consent, users sharing sensitive details, models revealing personal data, difficulty deleting data from a trained model, age checks.<\/p>\n<div class=\"ex\"><b>Italy fines OpenAI (Dec 2024).<\/b> Italy's Garante (which briefly banned ChatGPT in 2023) fined OpenAI <b>€15 million<\/b> under GDPR: training on personal data without legal basis, transparency failures, an unreported March 2023 breach, weak age checks. Ordered a six-month public campaign. OpenAI said it would appeal.<\/div>\n<div class=\"ex\"><b>Bartz v. Anthropic.<\/b> Authors sued over millions of pirated books used to train Claude. In June 2025 Judge William Alsup ruled training on <b>lawfully obtained books was fair use<\/b>, but building a library from <b>pirate sites was not<\/b>. Settlement: <b>$1.5 billion<\/b> (~$3,000 per book, ~500,000 books), pirated files destroyed; final approval July 2026, the largest copyright recovery in US history.<\/div>\n\n<h3>11.5 Regulation around the world (as of November 2026)<\/h3>\n<table class=\"tbl\"><tr><th>Region<\/th><th>Approach<\/th><th>Key rules and status<\/th><\/tr>\n<tr><td>EU<\/td><td>One comprehensive, risk-based law (AI Act)<\/td><td>In force Aug 2024. Bans since Feb 2025; general-purpose AI rules Aug 2025; transparency (Art. 50) Aug 2026. The 2026 \"Digital Omnibus\" delayed high-risk rules to <b>Dec 2027<\/b> (Aug 2028 for regulated products) and added bans on nudifier apps and AI child abuse material.<\/td><\/tr>\n<tr><td>China<\/td><td>Targeted rules from the Cyberspace Administration of China<\/td><td>2023 Interim Measures for Generative AI; deep synthesis rules (2023); mandatory labels with hidden metadata (Sept 2025); no single national AI law.<\/td><\/tr>\n<tr><td>US<\/td><td>No federal AI law; executive orders + state laws<\/td><td>Dec 2025 executive order seeks a national framework and challenges state laws, but nothing preempts them. State laws: <b>California SB 53<\/b> (frontier AI transparency, Jan 2026), <b>Texas TRAIGA<\/b>; Colorado replaced its 2024 Act with a narrower law from 2027. Dispute unresolved.<\/td><\/tr>\n<tr><td>Global<\/td><td>Voluntary principles<\/td><td>UNESCO Recommendation (2021); OECD AI Principles.<\/td><\/tr><\/table>\n<p><b>EU AI Act risk tiers:<\/b><\/p>\n<ol>\n<li><b>Unacceptable → banned:<\/b> government social scoring, manipulative AI exploiting vulnerable people.<\/li>\n<li><b>High → strict rules:<\/b> hiring, credit, education, law enforcement, border control, critical infrastructure (risk management, data quality, human oversight, documentation).<\/li>\n<li><b>Limited → transparency:<\/b> chatbots must say they're AI; AI content must be marked.<\/li>\n<li><b>Minimal → no new duties:<\/b> spam filters, video games.<\/li>\n<\/ol>\n<p><b>The debate:<\/b> supporters say rules protect rights and trust; critics say strict or fragmented rules raise costs and slow innovation. The EU's own delay shows how hard it is.<\/p>\n\n<h3>11.6 Responsibility and accountability<\/h3>\n<p>AI can't be held accountable itself, so responsibility sits with people and organizations.<\/p>\n<table class=\"tbl\"><tr><th>Actor<\/th><th>Responsibilities<\/th><\/tr>\n<tr><td>Developers<\/td><td>Safe design, testing, documenting risks and limits, preventing misuse<\/td><\/tr>\n<tr><td>Deployers<\/td><td>Appropriate uses, human oversight, informing people, monitoring results<\/td><\/tr>\n<tr><td>Governments<\/td><td>Laws, enforcement, protecting rights, public education<\/td><\/tr>\n<tr><td>Users<\/td><td>Checking important outputs, not misusing tools, disclosing AI use<\/td><\/tr><\/table>\n<p><b>Accountability tools:<\/b> model/system cards, red-teaming, impact assessments, independent audits, incident reporting, human review for high-stakes decisions.<\/p>\n<p><b>Transparency is slipping:<\/b> Stanford's 2025 Foundation Model Transparency Index (100 indicators) average fell from <b>58 (2024) to 40 (2025)<\/b>. IBM scored highest ever (<b>95<\/b>); Meta fell 60 → 31; Mistral 55 → 18. Least disclosed: training data and compute.<\/p>\n<p>Courts hold <b>lawyers<\/b>, not ChatGPT, responsible for fake citations: <b>\"the AI did it\" is not a defense<\/b>.<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 11.1 · Sort by EU AI Act risk tier (paper)<\/b><\/p><p>Place each in a tier: government social scoring, a CV-screening tool, a customer service chatbot, a spam filter, an AI exam-proctoring system, a video-game character.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Unacceptable; high; limited; minimal; high (education); minimal.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 11.2 · Deepfake defense plan (scenario)<\/b><\/p><p>You get a video call from your company's \"CFO\" asking for an urgent transfer. Write three things you would do before sending any money.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> E.g. call back on a known number, use a code word, require a second person to approve (the Arup lessons).<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>UNESCO's principles are shared worldwide but hard to apply (\"which fairness?\").<\/li>\n<li>Three landmark cases: Arup (deepfake fraud), Italy (privacy), Bartz (copyright).<\/li>\n<li>EU = one risk-based law; China = targeted rules; US = no federal law.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>Deepfake<\/dt><dd>AI-generated fake video, image or audio of a real person.<\/dd>\n<dt>Watermarking<\/dt><dd>Marking content as AI-generated, visibly or in metadata.<\/dd>\n<dt>GDPR<\/dt><dd>The EU's data protection law.<\/dd>\n<dt>Fair use<\/dt><dd>US doctrine allowing some uses of copyrighted work without permission.<\/dd>\n<dt>Preemption<\/dt><dd>A federal law overriding state laws.<\/dd>\n<dt>Model card<\/dt><dd>Documentation of a model's purpose, limits and risks.<\/dd>\n<dt>Red-teaming<\/dt><dd>Deliberately attacking a system to find weaknesses.<\/dd>\n<\/dl><\/div>","q":[["mc","How many countries adopted UNESCO's AI ethics recommendation?",["105","193","200+","27"],1,"The first global AI ethics standard (non-binding), 2021."],["mc","In the Arup case, what happened?",["An employee made 15 transfers after a video call where everyone was a deepfake","A chatbot leaked passwords","An AI hired only men","A robotaxi crashed"],0,"$25.6M was lost before he checked with head office."],["mc","Why did Italy fine OpenAI €15M?",["Training on personal data without legal basis, an unreported breach, weak age checks","Deepfakes","Copyright theft","Monopoly"],0,"A GDPR fine, Dec 2024."],["mc","In Bartz v. Anthropic, which training data was NOT fair use?",["Pirated libraries","Lawfully bought books","Public-domain texts","Wikipedia"],0,"Lawfully bought books were fair use; pirated copies were not."],["mc","Under the EU AI Act, AI used for hiring and credit is:",["Minimal risk","High risk","Limited risk","Unacceptable risk"],1,"High-risk systems face strict rules."],["mc","Social scoring under the EU AI Act is:",["High risk","Banned (unacceptable risk)","Minimal risk","Allowed"],1,"Banned since Feb 2025."],["mc","What is the US approach to AI regulation (Nov 2026)?",["Same as the EU","No federal AI law; a federal–state dispute","Total ban","One federal AI law"],1,"Dec 2025 executive order vs state laws like California SB 53 and Texas TRAIGA."],["mc","What happened to the Foundation Model Transparency Index average from 2024 to 2025?",["Rose 40 → 58","Fell 58 → 40","Doubled","Stayed the same"],1,"Training data and compute were least disclosed."],["mc","Which law requires independent bias audits of AI hiring tools?",["NYC Local Law 144","GDPR","Texas TRAIGA","TAKE IT DOWN Act"],0,"New York City's Local Law 144."],["mc","What does the US TAKE IT DOWN Act (May 2025) do?",["Criminalizes sharing non-consensual intimate deepfakes","Sets up the AI Act","Fines OpenAI","Bans all AI"],0,"A targeted deepfake law."],["mc","The \"liar's dividend\" means:",["Paying people to lie","Profit from deepfake ads","When anything can be faked, people may stop trusting real evidence too","A tax on AI"],2,"Protecting trust in real information is a shared job."],["mc","In Bartz v. Anthropic, about how much was paid per book?",["$3,000","$30","$30,000","$300"],0,"~$3,000 for ~500,000 books, $1.5B total."],["mc","Under the 2026 Digital Omnibus, EU high-risk AI rules were delayed to:",["Dec 2027","Feb 2025","2035","Aug 2026"],0,"And to Aug 2028 for AI in regulated products."],["mc","California SB 53 focuses on:",["Frontier AI transparency","Data deletion","Robotaxis","Deepfake labels"],0,"In effect since January 2026."],["mc","Which company scored highest ever (95) on the 2025 Foundation Model Transparency Index?",["IBM","OpenAI","Mistral","Meta"],0,"Meta fell 60 → 31; Mistral 55 → 18."],["tf","Under the EU AI Act, chatbots must tell users they are AI.",true,"Limited-risk transparency duty."],["tf","\"Which fairness?\" is a purely technical question.",false,"Choosing between equal accuracy, approval or error rates is a value judgment."],["tf","The UNESCO Recommendation on the Ethics of AI is legally binding.",false,"It is non-binding, but countries report on how they apply it."],["sa","Compare the EU, China and US approaches to AI regulation.","EU: one comprehensive risk-based law (AI Act) with tiered duties and phased deadlines. China: targeted rules from the Cyberspace Administration (generative AI measures 2023, mandatory labels Sept 2025). US: no federal AI law; executive order in Dec 2025 against state laws such as California SB 53 and Texas TRAIGA, dispute unresolved."],["sa","Who is responsible when AI causes harm? Name the four actors and one duty each.","Developers: safe design, testing, documenting limits. Deployers: appropriate use, human oversight, informing people. Governments: laws, enforcement, public education. Users: checking outputs, not misusing tools, disclosing AI use."],["sa","Explain the \"which fairness?\" problem with an example.","Fairness can mean equal accuracy across groups, equal approval rates, or equal error rates, and these can conflict. E.g. a loan model with equal approval rates may have different error rates per group. Choosing one definition is a value judgment, not just a technical choice."]]},{"n":12,"title":"The AI Economy & Future of Search","sum":"SEO changes, zero-click searches, monetisation, market dynamics and where search goes next.","html":"<h3>12.1 The AI economy<\/h3>\n<p>The money flowing into building AI (chips, data centers, models) and the value it creates. Search is at the center: it's where the internet's biggest ad business meets AI's most popular use.<\/p>\n<ul>\n<li><b>Investment:<\/b> US private AI investment ~<b>$286B<\/b> in 2025 vs Europe ~$21B and China ~$12B (Stanford AI Index 2026).<\/li>\n<li><b>Adoption:<\/b> generative AI reached <b>53%<\/b> within three years.<\/li>\n<li><b>Consumer value:<\/b> ~<b>$172B<\/b> a year to US consumers by early 2026.<\/li>\n<\/ul>\n<table class=\"tbl\"><tr><th>The old trade<\/th><th>In return<\/th><th>Now<\/th><\/tr>\n<tr><td>Sites let Google crawl their content for free<\/td><td>Google sends visitors who see ads or buy<\/td><td>AI answers keep users on the page; search still needs content, but creators get fewer visits<\/td><\/tr><\/table>\n\n<h3>12.2 Zero-click searches and the traffic shift<\/h3>\n<table class=\"tbl\"><tr><th>Measure<\/th><th>Finding<\/th><th>Source<\/th><\/tr>\n<tr><td>US searches with no click<\/td><td>~45% (2016) → 60.45% (2024) → <b>68.01%<\/b> (Jan–Apr 2026)<\/td><td>SparkToro / Similarweb<\/td><\/tr>\n<tr><td>Clicks with an AI summary<\/td><td><b>8%<\/b> vs 15% without; <b>1%<\/b> click a link inside<\/td><td>Pew Research<\/td><\/tr>\n<tr><td>#1 result CTR with an AI Overview<\/td><td>Down ~<b>58%<\/b> (Dec 2025), up from a 34.5% drop in Apr 2025<\/td><td>Ahrefs, 300,000 keywords<\/td><\/tr>\n<tr><td>Lower positions<\/td><td>Position 2 lost about half its clicks; position 10 nearly 20%<\/td><td>Ahrefs<\/td><\/tr>\n<tr><td>Google's share of traffic to 75,000+ sites<\/td><td>Down ~22% (June 2025 → May 2026)<\/td><td>Ahrefs via SparkToro<\/td><\/tr>\n<tr><td>Publisher search referrals<\/td><td>Down ~<b>33%<\/b> globally, <b>38%<\/b> in the US<\/td><td>Reuters Institute<\/td><\/tr><\/table>\n<p><b>Hit hardest:<\/b> simple informational content (definitions, how-tos, travel tips, recipes, health facts); brand and shopping searches less. A Berlin travel guide lost <b>70%<\/b> of its traffic after seven years of growth. <b>Google's view:<\/b> overall traffic is stable and AI clicks are \"higher quality\"; independent studies mostly find fewer clicks. <b>Risk:<\/b> if creators stop publishing, AI has less fresh material.<\/p>\n\n<h3>12.3 From SEO to GEO<\/h3>\n<p><b>SEO<\/b> = ranking high in results. New goals: <b>AEO<\/b> (answer engine optimization: picked as a direct answer) and <b>GEO<\/b> (generative engine optimization: cited by ChatGPT, Perplexity, AI Overviews).<\/p>\n<p><b>The GEO paper<\/b> (Princeton, Georgia Tech, Allen Institute for AI, IIT Delhi; KDD 2024), ~<b>10,000<\/b> queries: adding <b>quotations, statistics and citations<\/b> raised visibility up to <b>40%<\/b> (37% on Perplexity); <b>keyword stuffing barely helped<\/b>; <b>lower-ranked sites gained most<\/b>.<\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Traditional SEO<\/th><th>GEO / AI search<\/th><\/tr>\n<tr><td>Goal<\/td><td>Rank high in links<\/td><td>Be cited or mentioned in the answer<\/td><\/tr>\n<tr><td>Competes on<\/td><td>One keyword<\/td><td>Many fan-out sub-questions<\/td><\/tr>\n<tr><td>What helps<\/td><td>Keywords, backlinks, page speed<\/td><td>Clear answers, stats, sources, expert quotes, authority, freshness<\/td><\/tr>\n<tr><td>Success<\/td><td>Rankings, clicks, traffic<\/td><td>Citations, brand mentions, share of voice<\/td><\/tr><\/table>\n<p><b>In practice:<\/b> direct answers near the top, original data and named experts, cover related sub-questions, keep pages updated, let AI crawlers in, build a brand people search for. GEO is young and engines change often.<\/p>\n\n<h3>12.4 Monetisation: who pays for AI answers?<\/h3>\n<p>AI answers cost far more to produce than links, yet show fewer ads and send fewer clicks.<\/p>\n<table class=\"tbl\"><tr><th>Model<\/th><th>How it works<\/th><th>Example (2026)<\/th><\/tr>\n<tr><td>Ads in answers<\/td><td>Sponsored or labeled ads in or below the answer<\/td><td>Google scaling ads in AI Overviews/AI Mode (10 countries, multi-turn ads in US). ChatGPT tested ads from <b>9 Feb 2026<\/b>; <b>$1B<\/b> run rate by 31 Aug<\/td><\/tr>\n<tr><td>Subscriptions<\/td><td>Monthly fee for better models, higher limits<\/td><td>ChatGPT Plus/Pro, Google AI plans, Perplexity Pro<\/td><\/tr>\n<tr><td>Content licensing<\/td><td>AI firms pay publishers<\/td><td>OpenAI and Condé Nast<\/td><\/tr>\n<tr><td>Pay-per-crawl<\/td><td>Sites charge AI bots per page or use<\/td><td>Cloudflare blocks AI crawlers by default (since <b>July 2025<\/b>), pay-per-crawl beta<\/td><\/tr><\/table>\n<p><b>Google's balancing act (Q3 2026):<\/b> search revenue grew <b>12% to $63.35B<\/b>, slower than 17% the quarter before, even as queries grew fastest in five years. AI Mode earns <b>less per query<\/b> than classic search. <b>OpenAI ads<\/b> appear below answers labeled \"sponsored\"; OpenAI says they don't influence answers; target $2.5B for 2026. <b>Questions:<\/b> can users tell paid from organic? Will commercial pressure affect answers?<\/p>\n\n<h3>12.5 Market dynamics<\/h3>\n<table class=\"tbl\"><tr><th>Player<\/th><th>Position (2026)<\/th><\/tr>\n<tr><td>Google<\/td><td>~89–90% of global traditional search; AI Overviews 2B+; AI Mode 1B+<\/td><\/tr>\n<tr><td>OpenAI<\/td><td>1B+ weekly ChatGPT users; leading chatbot; now selling ads<\/td><\/tr>\n<tr><td>Microsoft<\/td><td>~5% of traditional search; Copilot in Windows and Office<\/td><\/tr>\n<tr><td>Perplexity<\/td><td>AI-native answer engine with its own index<\/td><\/tr>\n<tr><td>Others<\/td><td>Gemini app, Claude, DeepSeek, Baidu, Yandex, Naver<\/td><\/tr><\/table>\n<p><b>US v. Google antitrust:<\/b> <b>Aug 2024<\/b> ruled an illegal search monopoly. <b>Sept 2025<\/b> remedies (Judge Amit Mehta): no forced Chrome sale (citing AI competition), but exclusive distribution deals banned for <b>6 years<\/b> and some index and interaction data shared with rivals. <b>Jan 2026:<\/b> Google appealed; DOJ and states cross-appealed. Ongoing.<\/p>\n<p><b>Forces:<\/b> default placement drives usage; the huge cost of AI favors big companies; publishers blocking crawlers could limit smaller engines.<\/p>\n\n<h3>12.6 Future development: links → answers → agents<\/h3>\n<table class=\"tbl\"><tr><th>When<\/th><th>Agentic commerce milestone<\/th><\/tr>\n<tr><td>Sept 2025<\/td><td>OpenAI Instant Checkout in ChatGPT with Stripe's Agentic Commerce Protocol (<b>ACP<\/b>)<\/td><\/tr>\n<tr><td>Jan 2026<\/td><td>Google Universal Commerce Protocol (<b>UCP<\/b>) with Shopify, Etsy, Wayfair, Target, Walmart<\/td><\/tr>\n<tr><td>Mar 2026<\/td><td>OpenAI retires Instant Checkout for ordinary merchants: \"discover in AI, buy on the retailer's site\"; Shopify makes 5.6M stores discoverable in AI tools<\/td><\/tr>\n<tr><td>Autumn 2026<\/td><td>Google agentic checkout in AI Mode and Gemini (early access); Universal Cart in US<\/td><\/tr><\/table>\n<ul>\n<li><b>Multimodal and conversational:<\/b> AI Mode queries ~3× longer; 1 in 5 uses voice, images or documents; visual searches pass 50 billion a month.<\/li>\n<li><b>Conversational ads<\/b> that answer follow-up questions.<\/li>\n<li><b>A new content deal:<\/b> a paid content market, or a web split into open and walled-off sites.<\/li>\n<li><b>Personalization and memory:<\/b> more relevant answers, more privacy concerns.<\/li>\n<\/ul>\n<p><b>Open questions:<\/b> will publishers keep producing quality content? Will citations improve? Will regulators let a few firms control the gateway to information? Can ads coexist with trustworthy answers?<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 12.1 · GEO makeover<\/b><\/p><p>Take one paragraph from a website you like (or one you wrote). Rewrite it so an AI search engine is more likely to cite it: a direct answer first, a statistic with its source, and a named expert or official quote.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> These are the changes that raised visibility up to 40% in the GEO paper.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 12.2 · Zero-click diary<\/b><\/p><p>Over one day, search 10 everyday questions. Tally how many you answered without clicking any link.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Compare your share with the 68% national figure. Which kinds of questions still needed a click?<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>The old crawl-for-traffic trade is breaking; zero-click hit 68%.<\/li>\n<li>SEO → GEO: be cited, not just ranked.<\/li>\n<li>Money: ads in answers, subscriptions, licensing, pay-per-crawl.<\/li>\n<li>Google dominates but faces antitrust remedies; search is moving toward agents.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>CTR<\/dt><dd>Click-through rate: share of people who see a result and click it.<\/dd>\n<dt>GEO / AEO<\/dt><dd>Optimizing to be cited inside AI-generated answers.<\/dd>\n<dt>Share of voice<\/dt><dd>How often a brand is mentioned or cited in AI answers.<\/dd>\n<dt>Annualized run rate<\/dt><dd>Current monthly revenue × 12.<\/dd>\n<dt>Pay-per-crawl<\/dt><dd>Charging AI bots each time they access a page.<\/dd>\n<dt>Antitrust<\/dt><dd>Laws preventing monopolies and unfair competition.<\/dd>\n<dt>Agentic commerce<\/dt><dd>AI agents that find, compare and buy products.<\/dd>\n<dt>ACP / UCP<\/dt><dd>OpenAI's and Google's protocols for AI shopping.<\/dd>\n<\/dl><\/div>","q":[["mc","What was the \"old trade\" between websites and Google?",["Google paid every site per visit","Sites paid Google to be indexed","Sites let Google crawl for free; Google sent visitors","There was no trade"],2,"AI answers break this deal by keeping users on the page."],["mc","Roughly what share of US Google searches ended with no click in early 2026?",["45%","90%","60%","68%"],3,"68.01% (SparkToro / Similarweb)."],["mc","Ahrefs found the #1 result's click-through rate fell about how much when an AI Overview appeared?",["~8%","~33%","~58%","~90%"],2,"Study of 300K keywords."],["mc","What is the main goal of GEO?",["Be cited in the AI answer","Rank #1 in blue links","Block all AI crawlers","Buy more ads"],0,"Success is measured in citations, mentions and share of voice."],["mc","In the GEO paper (KDD 2024), which tactic barely helped?",["Adding statistics","Adding citations","Adding expert quotes","Keyword stuffing"],3,"Quotes, stats and citations raised visibility ~40%."],["mc","Cloudflare's \"pay-per-crawl\" approach means:",["Blocking AI bots by default unless they pay","Paying users to search","Free crawling for all","Selling ads in answers"],0,"Since July 2025."],["mc","What did the Sept 2025 US v. Google remedy include?",["No changes","Ban on exclusive default deals for 6 years","Forced sale of Chrome","Breakup of Google"],1,"No Chrome sale, citing AI competition; some data shared with rivals."],["mc","Google's Q3 2026 search revenue grew 12% to $63.35B. Why is this a concern?",["Google lost market share to Bing","Ads were banned","Growth slowed from 17% even though queries grew fastest in five years","It shrank"],2,"AI Mode earns less per query than classic search."],["mc","Ahrefs found the #1 result's CTR drop grew from 34.5% (April 2025) to about what by December 2025?",["90%","68%","40%","58%"],3,"Position 2 lost about half its clicks; position 10 nearly 20%."],["mc","What is AEO?",["Answer engine optimization","Ad exchange operation","AI ethics office","Automatic error output"],0,"Shaping content to be picked as a direct answer."],["mc","\"Annualized run rate\" means:",["Number of users per year","Total revenue since launch","Current monthly revenue × 12","Profit after tax"],2,"ChatGPT ads hit a $1B run rate by August 2026."],["mc","Why did Judge Mehta not force Google to sell Chrome?",["He cited new competition from AI","Google had already sold it","Chrome was too small","The DOJ didn't ask"],0,"But exclusive default deals were banned for 6 years."],["mc","What did OpenAI shift to in March 2026?",["Instant Checkout for all merchants","Closing ChatGPT","\"Discover in AI, buy on the retailer's site\"","Paying users to shop"],2,"It retired Instant Checkout for ordinary merchants."],["mc","Which company's protocol is UCP?",["Stripe","Google","Cloudflare","OpenAI"],1,"Universal Commerce Protocol (Jan 2026). ACP is OpenAI + Stripe."],["mc","Google's share of traffic to 75,000+ websites fell by about how much (June 2025 → May 2026)?",["2%","70%","58%","22%"],3,"Ahrefs tracker via SparkToro."],["tf","ChatGPT started showing ads in February 2026.",true,"It passed a $1B run rate by August."],["tf","In GEO, lower-ranked sites gained the most visibility.",true,"That makes GEO a chance for smaller sites."],["tf","Google argues clicks from AI results are \"higher quality,\" while independent studies mostly find fewer clicks.",true,"Both views appear in the notes."],["sa","Explain how zero-click search threatens publishers, using two statistics.","AI answers satisfy users on the results page, so fewer people visit the sources that supplied the content. Zero-click rose to ~68% in early 2026; Pew shows clicks fall from 15% to 8% with an AI summary (1% click links inside it); Reuters Institute reports publisher search referrals down ~33% globally. Fewer visits mean less ad and sales revenue."],["sa","Compare traditional SEO with GEO on goal, competition and success measure.","SEO: goal is ranking high in the link list, competing on one keyword with keywords/backlinks/speed, measured by rankings and clicks. GEO: goal is being cited in the AI answer, competing on many fan-out sub-questions with clear answers, stats, sources, quotes and freshness, measured by citations, mentions and share of voice."],["sa","List four things a website should do to be cited by AI search (GEO).","Any four: clear direct answers near the top; original data and statistics; named expert quotes and sources; cover related sub-questions (fan-out); keep pages updated; let AI crawlers access the site; build a brand people search for by name."]]}],"RUB":{"Give the three reasons search engines started writing answers, and the main catch.":["Users want direct answers (about half of ChatGPT messages are \"Asking\")","Questions are longer and multimodal (AI Mode ~3× longer; 1 in 5 voice/images/docs)","Owning the answer = attention, ads and shopping","Catch: fewer clicks to websites (8% vs 15%) and more trust placed in the AI"],"Using the laptop example, contrast classic search and AI Mode.":["Classic search: ranked list of review sites","The user opens and compares them","AI Mode reads the reviews and writes a comparison with recommendations","AI Mode cites the reviews it used"],"Explain how each era of search shifted work from the user to the search engine.":["Keyword era: engine takes over finding pages","BERT era: engine understands the question","AI Overviews: engine reads and summarizes sources","Agents: engine starts acting for the user"],"Fill in the timeline: what happened in 2016, 2019, May 2024 and 2026?":["2016: instant answers / featured snippets (~45% zero-click)","2019: BERT (~1 in 10 US English searches)","May 2024: AI Overviews to all US users","2026: AI Mode 1B+ users; agents compare and buy"],"Describe the five steps of the ML training loop.":["Collect data and pick a model","Train: predict → loss → adjust parameters, repeated","Test on unseen data (check for overfitting)","Deploy and monitor (data drifts)"],"Compare supervised, unsupervised and reinforcement learning, with one example each.":["Supervised = labeled examples (e.g. fraud or spam classifier)","Unsupervised = finds structure without labels (e.g. shopper segments)","Reinforcement = trial, error and reward (e.g. AlphaGo, RLHF)"],"Explain support, confidence and lift for an association rule {A} → {B}.":["Support: how often A and B appear together in all baskets","Confidence: share of baskets with A that also have B","Lift: confidence ÷ how common B is","Lift > 1 = real link; lift = 1 = no link"],"Describe the five layers of the robot stack.":["Perceive (sensors + computer vision)","Localize and map (SLAM)","Plan (motion planning, e.g. A*, RRT) and control (e.g. PID)","Learn (imitation, RL / sim-to-real)"],"Calculate accuracy, precision and recall for TP = 15, FP = 3, FN = 5, TN = 77, and explain what each tells you.":["Accuracy = 92% (all correct predictions ÷ total)","Precision ≈ 83% (of flagged, how many really spam)","Recall = 75% (of real spam, how much caught)","Shows working with the correct formulas"],"Explain overfitting and underfitting with an analogy, and give two ways to prevent overfitting.":["Underfitting: too simple, poor on training and test","Overfitting: memorizes training data, poor on new data","A sensible analogy (e.g. memorizing last year's answers)","Two prevention methods (more data, regularization, dropout, early stopping, cross-validation)"],"Explain the four stages that turn raw text into a useful AI assistant.":["Pretraining: predict the next token on huge text","Transformer architecture with attention","Alignment: SFT + RLHF (reward model from human rankings)","Grounding with retrieval (RAG)"],"Explain step by step how an LLM produces an answer to your question.":["Prompt → tokens → embeddings","Transformer outputs a probability for each next token","One token chosen (temperature), repeated one at a time (autoregressive)","Picks likely text, not verified text"],"Compare closed and open-weight models: give one example of each and one advantage and disadvantage of each.":["Correct examples of each (e.g. GPT/Gemini/Claude vs DeepSeek/Qwen/Llama)","Closed: most capable / managed, but cost and less control","Open: cheaper, private, customizable, but harder to run and guardrails removable","Open models were only a few points behind in 2026"],"Give four tips for prompting generative AI well.":["Be specific (task, audience, length, format)","Give context or examples","Ask for and check sources / use search for current facts","Iterate, ask neutrally, avoid sharing sensitive data"],"Walk through how an NLP system processes \"I loved it!\" for sentiment analysis.":["Tokenize: I / loved / it / !","Normalize: \"loved\" → \"love\"; tag parts of speech","Embed tokens as vectors; Transformer reads in context","Output label: positive"],"Describe the three eras of NLP with one example each.":["Rules (1950s–80s), e.g. Georgetown-IBM or ELIZA","Statistics (late 1980s–2000s), e.g. IBM statistical translation","Deep learning (2013–now), e.g. word2vec, Transformers, BERT/GPT"],"Describe the five steps of a voice assistant answering \"What's the weather tomorrow?\"":["Wake word detection","Speech recognition (audio → text)","NLU: intent (get weather) + slots (tomorrow, place)","Look up the answer and reply with text-to-speech"],"Compare BERT and GPT.":["BERT = encoder; GPT = decoder","BERT fills in masked words using both sides; GPT predicts the next word left to right","BERT best for understanding (search, classification); GPT for generating","Correct example use of each (Google Search 2019; ChatGPT)"],"Explain how text representation evolved from bag of words to contextual embeddings.":["Bag of words / one-hot: counts, no meaning or order","TF-IDF weights distinctive words","word2vec: meaning vectors (king − man + woman ≈ queen), one per word","Contextual embeddings change with the sentence (\"bank\")"],"\"Design and oversight decide whether AI pays off.\" Support this with two examples from the industries topic.":["Harvard tutor: design (step-by-step reasoning) doubled learning","Klarna moved to hybrid so humans stay available","Or: Wuhan Apollo Go outage shows failures scale","Links each example back to design or oversight"],"For any two industries, name one AI use, the technology behind it, and one challenge.":["Two different industries named","A correct AI use for each","The matching technology (vision, NLP, predictive analytics, robotics)","A real challenge for each"],"Explain why an AI search answer can be both impressive and wrong.":["It is a pipeline; each step can fail (retrieval, ranking, chunking, generation)","The model can misread a correct source","Answer still sounds fluent and has citations, hiding errors","Evidence: Tow Center 60%+ wrong"],"Explain how a citation number ends up next to a claim in an AI answer.":["Retrieved passages are numbered in the prompt","Model is told to add the number after the claim it supports","Interface turns numbers into links/footnotes"],"An AI says a new law took effect last month and cites a news site. Apply SIFT step by step.":["Stop: pause, is it surprising?","Investigate the source: open the link, who wrote it?","Find better coverage: do other trusted sources agree?","Trace to the original: government source shows it was only proposed"],"Name four layers of the accuracy stack and the trade-off they share.":["Four correct layers (grounding, citations, claim verification, CoVe, self-consistency, abstention, second-model review, human review)","Trade-off: each check adds time and cost","Products balance speed against reliability"],"A help bot must answer customer questions about company policy. Describe how you would design it to be accurate.":["Ground it only on the policy documents (RAG)","Cite the section for each claim / verify claims","Allow abstention: say when docs don't cover it","Offer a human agent and review high-stakes answers"],"Explain prompt injection with an example, and why it matters more as AI takes actions.":["Hidden instructions in content the AI reads","Example: white-on-white \"ignore previous instructions\" text","Works because the model can't separate data from commands","Agents can leak data or take harmful actions; no complete fix"],"Pick three failure modes and give each one's root cause.":["Three different failure modes named","Correct root cause for each (e.g. cutoff, rewarded guessing, attention in the middle, human approval, skewed data)"],"Why can a system that works 95% of the time still be unsafe?":["Errors add up over millions of runs","In multi-step tasks every step must succeed, so overall success falls","Needs human oversight, fallbacks, realistic testing"],"Design an AI shopping agent's checkout so users keep calibrated trust. Use at least two design guidelines.":["Stop and show a summary (item, price, card) before paying","Easy to cancel, undo or correct","Explain choices and cite sources","Say up front what it can and can't do (Microsoft guidelines)"],"Explain why explanations and confidence scores do not always produce calibrated trust.":["Explanations increase acceptance whether right or wrong","Users accept wrong high-confidence answers and reject correct low-confidence ones","Trust signals must change behavior (e.g. cognitive forcing, friction matched to stakes)"],"Compare the EU, China and US approaches to AI regulation.":["EU: one risk-based law (AI Act) with tiers and phased dates","China: targeted CAC rules (generative AI measures, labeling)","US: no federal law; executive order vs state laws (SB 53, TRAIGA)"],"Who is responsible when AI causes harm? Name the four actors and one duty each.":["Developers: safe design, testing, documenting limits","Deployers: appropriate use, human oversight","Governments: laws and enforcement","Users: check outputs, don't misuse, disclose AI use"],"Explain the \"which fairness?\" problem with an example.":["Fairness has several definitions (equal accuracy, approval rates, error rates)","They can conflict","Choosing one is a value judgment","A concrete example (e.g. loans or hiring)"],"Explain how zero-click search threatens publishers, using two statistics.":["AI answers keep users on the results page","Two correct statistics (68% zero-click; 15% → 8%; 1%; −33% referrals; −58% CTR)","Fewer visits = less ad/sales revenue","Risk: less fresh content for AI to use"],"Compare traditional SEO with GEO on goal, competition and success measure.":["Goal: rank in links vs be cited in the answer","Competition: one keyword vs many fan-out sub-questions","Success: rankings/clicks vs citations, mentions, share of voice"],"List four things a website should do to be cited by AI search (GEO).":["Clear direct answers near the top","Original data, statistics and sources","Named expert quotes; cover related sub-questions","Keep updated; let AI crawlers in; build a known brand"]},"about":"\n<table class=\"tbl meta\">\n<tr><td><b>Title<\/b><\/td><td>AI Overview: Study Guide<\/td><\/tr>\n<tr><td><b>Team<\/b><\/td><td>Max XP (7 members, see Team members page)<\/td><\/tr>\n<tr><td><b>Module<\/b><\/td><td>AI Overview<\/td><\/tr>\n<tr><td><b>Version<\/b><\/td><td>V1.0 · November 2026<\/td><\/tr>\n<tr><td><b>Companion files<\/b><\/td><td>AI Overview Test Bank &amp; Answer Key (separate document); interactive study kit (HTML, optional)<\/td><\/tr>\n<\/table>\n<h3>Who it's for and prerequisites<\/h3>\n<ul>\n<li>University students with <b>no technical background<\/b>. No coding or math beyond percentages is needed.<\/li>\n<li>You need to read English and use a web browser.<\/li>\n<li>For the \"Try it yourself\" activities, use any free AI chatbot or AI search tool (ChatGPT, Gemini, Claude, Perplexity, Google AI Mode). Follow your course's rules on AI use.<\/li>\n<li>Topics build on each other: read Topic 3 before Topics 4–5, and Topic 7 before Topics 8–9.<\/li>\n<\/ul>\n<h3>Learning goals<\/h3>\n<p>After working through this guide, you will be able to:<\/p>\n<ol>\n<li>Explain what AI Overviews and answer engines are, and why search moved from links to answers.<\/li>\n<li>Describe the main types of machine learning and how models are trained, tested and measured.<\/li>\n<li>Explain how large language models are built and how they generate text, including why they hallucinate.<\/li>\n<li>Describe how NLP turns human language into something a computer can process.<\/li>\n<li>Give real examples of AI in healthcare, education, business, manufacturing and transportation.<\/li>\n<li>Trace the AI search pipeline from a question to a cited answer.<\/li>\n<li>Recognize common AI failure modes and fact-check an AI answer with SIFT.<\/li>\n<li>Discuss trust and design, ethics and regulation, and the economic effects of AI search.<\/li>\n<\/ol>\n<h3>Suggested route<\/h3>\n<table class=\"tbl\">\n<tr><th>Part<\/th><th>Topics<\/th><th>Focus<\/th><th>Approx. time<\/th><\/tr>\n<tr><td>A · Big picture<\/td><td>1–2<\/td><td>What AI search is and how it evolved<\/td><td>1 hour<\/td><\/tr>\n<tr><td>B · How AI works<\/td><td>3–5<\/td><td>Machine learning, LLMs, NLP<\/td><td>3–4 hours<\/td><\/tr>\n<tr><td>C · AI in the world<\/td><td>6<\/td><td>Industry examples<\/td><td>45 minutes<\/td><\/tr>\n<tr><td>D · AI search and its limits<\/td><td>7–9<\/td><td>The pipeline, accuracy, failure modes<\/td><td>3 hours<\/td><\/tr>\n<tr><td>E · People, ethics, economy<\/td><td>10–12<\/td><td>User experience, responsibility, business<\/td><td>2–3 hours<\/td><\/tr><\/table>\n<p><b>For each topic:<\/b> read the notes → do the two \"Try it yourself\" activities → read the key takeaways → answer that topic's questions in the test bank → check with the answer key. <b>Short on time?<\/b> Read each topic's key takeaways, key terms and the worked examples, then do the test bank exam-style.<\/p>\n","resources":"\n<p class=\"intro\">Five free outside resources that go deeper on key topics. Each one lists why it is useful, which part to use, what to do, and what to watch out for.<\/p>\n<div class=\"res\"><p class=\"res-t\"><b>1. Large Language Models explained briefly (3Blue1Brown, video)<\/b><br><span class=\"url\">https://3blue1brown.substack.com/p/large-language-models-explained-briefly<\/span><\/p>\n<table class=\"tbl res-tbl\"><tr><td><b>Why it's useful<\/b><\/td><td>Clear animations of next-token prediction, training and Transformers, made for a general audience.<\/td><\/tr><tr><td><b>Which part<\/b><\/td><td>Topic 4 (4.3–4.4) and Topic 5 (embeddings). Watch the whole short video.<\/td><\/tr><tr><td><b>What to do<\/b><\/td><td>Pause when the video shows the list of next-word probabilities and compare it with Activity 4.1.<\/td><\/tr><tr><td><b>Watch out for<\/b><\/td><td>It simplifies a lot. It doesn't cover RAG, citations or AI search.<\/td><\/tr><\/table><\/div><div class=\"res\"><p class=\"res-t\"><b>2. Machine Learning Crash Course (Google for Developers, free course)<\/b><br><span class=\"url\">https://developers.google.com/machine-learning/crash-course<\/span><\/p>\n<table class=\"tbl res-tbl\"><tr><td><b>Why it's useful<\/b><\/td><td>Google's own beginner course with short lessons and interactive exercises.<\/td><\/tr><tr><td><b>Which part<\/b><\/td><td>Topic 3: the modules on linear regression, logistic regression and classification (accuracy, precision, recall).<\/td><\/tr><tr><td><b>What to do<\/b><\/td><td>Do the classification exercise and compare it with the confusion-matrix example in 3.2.<\/td><\/tr><tr><td><b>Watch out for<\/b><\/td><td>Some later modules use code; you can skip those for this guide.<\/td><\/tr><\/table><\/div><div class=\"res\"><p class=\"res-t\"><b>3. Google users are less likely to click on links when an AI summary appears (Pew Research Center, 2025)<\/b><br><span class=\"url\">https://www.pewresearch.org/short-reads/2025/07/22/google-users-are-less-likely-to-click-on-links-when-an-ai-summary-appears-in-the-results/<\/span><\/p>\n<table class=\"tbl res-tbl\"><tr><td><b>Why it's useful<\/b><\/td><td>The original study behind the 8% vs 15% and 1% click figures used throughout this guide.<\/td><\/tr><tr><td><b>Which part<\/b><\/td><td>Topics 1 and 12. Read the charts on click rates and on which sites are cited.<\/td><\/tr><tr><td><b>What to do<\/b><\/td><td>Write down two numbers to use in your answers about zero-click search.<\/td><\/tr><tr><td><b>Watch out for<\/b><\/td><td>It measures one month of browsing by US adults; other countries and later months may differ.<\/td><\/tr><\/table><\/div><div class=\"res\"><p class=\"res-t\"><b>4. We compared eight AI search engines. They're all bad at citing news (Columbia Journalism Review, Tow Center, 2025)<\/b><br><span class=\"url\">https://www.cjr.org/tow_center/we-compared-eight-ai-search-engines-theyre-all-bad-at-citing-news.php<\/span><\/p>\n<table class=\"tbl res-tbl\"><tr><td><b>Why it's useful<\/b><\/td><td>The citation-accuracy study behind Topic 7's 60%+ error rate.<\/td><\/tr><tr><td><b>Which part<\/b><\/td><td>Topic 7 (7.4). Read the method and the results chart by tool.<\/td><\/tr><tr><td><b>What to do<\/b><\/td><td>Note how they tested the tools, then try Activity 7.2 yourself.<\/td><\/tr><tr><td><b>Watch out for<\/b><\/td><td>It tests news citations only, from early 2025. Tools change quickly, so results today may be different.<\/td><\/tr><\/table><\/div><div class=\"res\"><p class=\"res-t\"><b>5. SIFT: The Four Moves (Mike Caulfield)<\/b><br><span class=\"url\">https://hapgood.us/sift/<\/span><\/p>\n<table class=\"tbl res-tbl\"><tr><td><b>Why it's useful<\/b><\/td><td>The fact-checking method from Topic 8, explained by the person who created it.<\/td><\/tr><tr><td><b>Which part<\/b><\/td><td>Topic 8 (8.6). Read the description of each move.<\/td><\/tr><tr><td><b>What to do<\/b><\/td><td>Use it on a real AI answer in Activity 8.2.<\/td><\/tr><tr><td><b>Watch out for<\/b><\/td><td>It was written for web pages in general, not specifically AI. Apply \"Investigate the source\" to each citation the AI gives.<\/td><\/tr><\/table><\/div>\n","references":"\n<p class=\"intro\">The main sources behind the facts and figures in this guide, grouped by topic. Most come from the team's research notes for each topic.<\/p>\n<h3>Topics 1–2: Big picture and search history<\/h3><ul class=\"refs\"><li>Pew Research Center, Google users are less likely to click on links when an AI summary appears in the results (2025)<\/li><li>Nairametrics, AI Overviews hits 2 billion users; WrittenlyHub, Google AI Mode crosses 1 billion users<\/li><li>SparkToro / Similarweb, zero-click search studies (2016–2026)<\/li><li>TechCrunch, Google brings in BERT to improve its search results (2019)<\/li><\/ul><h3>Topic 3: Machine learning and deep learning<\/h3><ul class=\"refs\"><li>Forbes via AITopics, Arthur Samuel and the origin of \"machine learning\"<\/li><li>Stanford HAI, 2026 AI Index Report<\/li><li>Google Machine Learning Crash Course<\/li><li>IBM, What is unsupervised learning?; IBM, What is the Apriori algorithm?<\/li><li>Wikipedia, AlphaGo versus Lee Sedol; Microsoft MSDN Magazine, Introduction to Reinforcement Learning<\/li><li>Alom et al., The History Began from AlexNet (arXiv); Argonne ATPESC, Intro to Deep Learning (2026)<\/li><li>SAP, What is predictive analytics?; Fritz AI glossary, Object Detection; NIH/PMC, YOLOv8 road video detection<\/li><li>Australian Manufacturing, IFR World Robotics 2026; Bloomberg, Waymo 1 million weekly trips; University of Washington CSE 571, Motion planning and control; National Geographic, Kilobot swarm<\/li><\/ul><h3>Topic 4: Generative AI and LLMs<\/h3><ul class=\"refs\"><li>Vaswani et al., Attention Is All You Need (2017)<\/li><li>Ouyang et al., Training language models to follow instructions with human feedback (InstructGPT, 2022)<\/li><li>Kalai et al. / OpenAI, Why Language Models Hallucinate (2025)<\/li><li>Artificial Analysis, Recent open weights model launches (April 2026)<\/li><li>Stanford HAI, 2026 AI Index Report (via secondary summaries)<\/li><li>Chatterji et al., How People Use ChatGPT (NBER, 2025)<\/li><\/ul><h3>Topic 5: Natural language processing<\/h3><ul class=\"refs\"><li>IBM, Natural language processing<\/li><li>Wikipedia, History of natural language processing; Wikipedia, Word2vec<\/li><li>NLPlanet, 33 important NLP tasks explained<\/li><li>TechCrunch and MobileSyrup, Google BERT in Search (2019)<\/li><\/ul><h3>Topic 6: AI in industries<\/h3><ul class=\"refs\"><li>McKinsey, The State of AI 2025<\/li><li>Radiology Business and FDA, List of AI-Enabled Medical Devices (March 2026)<\/li><li>Drug Target Review, Nobel Prize and AlphaFold<\/li><li>Kestin et al., AI Tutoring Outperforms Active Learning (Harvard); EdTech Innovation Hub, Khanmigo usage<\/li><li>Chain Store Age, Klarna AI assistant results<\/li><li>Körber, AI predictive maintenance; Analytics Insight, BMW AI defect detection; NVIDIA, Foxconn<\/li><li>eWeek, Apollo Go outage in Wuhan; INFORMS, UPS ORION<\/li><\/ul><h3>Topic 7: Inside AI search<\/h3><ul class=\"refs\"><li>Lewis et al., Retrieval-Augmented Generation (2020)<\/li><li>GEO Toolbox, What Is Query Fan-Out?; Digiday, WTF is query fan-out<\/li><li>ZipTie, How Perplexity AI answers work<\/li><li>NIT Agartala, TREC RAG 2025 report; Canonical, Hybrid search and reranking<\/li><li>Columbia Journalism Review / Tow Center, AI search has a citation problem (2025); Nieman Lab coverage<\/li><\/ul><h3>Topic 8: Accuracy and fact-checking<\/h3><ul class=\"refs\"><li>TheJournal.ie and The Register, Google AI Overviews glue and rocks errors (2024)<\/li><li>Charlotin AI hallucination cases database (via Vaquill); Bloomberg Law, AI faked cases<\/li><li>Vectara Hallucination Leaderboard<\/li><li>Cattan et al. / Google Research, DRAGged into Conflicts (2025)<\/li><li>Es et al., RAGAS (2023)<\/li><li>University of Washington CIP and Mike Caulfield, SIFT<\/li><\/ul><h3>Topic 9: Limitations and failure modes<\/h3><ul class=\"refs\"><li>Mirzadeh et al., GSM-Symbolic (Apple, 2024)<\/li><li>Liu et al., Lost in the Middle (2023)<\/li><li>OpenAI, Expanding on what we missed with sycophancy (2025)<\/li><li>Buolamwini and Gebru, Gender Shades (2018); MIT Technology Review, Amazon recruiting tool<\/li><li>OWASP Top 10 for LLM Applications (2025)<\/li><li>Stanford HAI, 2026 AI Index Report<\/li><\/ul><h3>Topic 10: User experience<\/h3><ul class=\"refs\"><li>Chatterji et al., How People Use ChatGPT (NBER, 2025)<\/li><li>Amershi et al., Guidelines for Human-AI Interaction (CHI 2019)<\/li><li>Google PAIR, People + AI Guidebook<\/li><li>AAAI-26, Confidence scores and automation bias<\/li><li>Be My Eyes, Be My AI<\/li><li>Microsoft Research and Carnegie Mellon, AI and critical thinking (CHI 2025); OpenAI and MIT Media Lab, affective use study (2025)<\/li><\/ul><h3>Topic 11: Ethics and responsibility<\/h3><ul class=\"refs\"><li>UNESCO, Recommendation on the Ethics of Artificial Intelligence (2021)<\/li><li>CNN, Arup deepfake scam (2024)<\/li><li>Analytics India Magazine and JD Supra, Italy fines OpenAI €15 million<\/li><li>Jurist and Association of American Publishers, Bartz v. Anthropic settlement<\/li><li>Orrick, EU AI Act Digital Omnibus; CMS, China AI labeling rules; GLACIS, US state AI laws<\/li><li>Stanford, Foundation Model Transparency Index 2025<\/li><\/ul><h3>Topic 12: AI economy<\/h3><ul class=\"refs\"><li>SparkToro, In 2026, less than one third of Google searches still send a click<\/li><li>Ahrefs, AI Overviews reduce clicks by 58%<\/li><li>Reuters Institute (via Press Gazette), publisher search referrals<\/li><li>Aggarwal et al., GEO: Generative Engine Optimization (KDD 2024)<\/li><li>The Register and AlphaSense, Alphabet Q3 2026; Quartz, ChatGPT ads; MIT Technology Review, Cloudflare blocks AI bots<\/li><li>Hughes Hubbard &amp; Reed, Remedies ruling in US v. Google; OpenAI, Instant Checkout; C9 Group, agentic commerce<\/li><\/ul>\n"};

  <article class="card notes"><h2>Team members</h2><p class="lede" style="margin-bottom:12px">Team Max XP · ${MEMBERS.length} members</p>
   <div class="tblwrap"><table class="mtbl"><tr><th>#</th><th>Name</th><th>Chinese name</th><th>Student ID</th><th>Role</th><th>Secondary role</th></tr>
   ${MEMBERS.map((m,i)=>`<tr><td>${i+1}</td><td><b>${m[0]}</b></td><td>${m[1]}</td><td class="id">${m[2]}</td><td>${m[3]}</td><td>${m[4]}</td></tr>`).join("")}</table></div></article>
  <article class="card notes"><h2>Recommended resources</h2>${wrapTables(DATA.resources)}</article>
  <article class="card notes"><h2>References</h2>${DATA.references}</article>`;
}

/* ===== STUDY GUIDE ===== */
let gTopic = store("aio2-guide") || 1;
function renderGuide(){
  const t = T.find(x=>x.n===gTopic) || T[0];
  const best = store("aio2-best") || {};
  $("#v-guide").innerHTML = `
  <div><h1>Study guide</h1><p class="lede">Full notes for each topic, with real examples, two "Try it yourself" activities, key takeaways and key terms.</p></div>
  <div class="chips" role="group" aria-label="Topics">${T.map(x=>`<button class="chip" data-g="${x.n}" aria-pressed="${x.n===t.n}">${pad(x.n)} ${esc(x.title)}${best[x.n]>=80?'<span class="done">✓</span>':''}</button>`).join("")}</div>
  <article class="card">
    <span class="eyebrow">Topic ${pad(t.n)} of ${T.length}</span>
    <h2 style="margin-top:6px">${esc(t.title)}</h2>
    <p class="lede">${t.sum}</p>
    <div class="notes">${wrapTables(t.html)}</div>
    <div class="row" style="margin-top:18px">
      <a class="btn" href="#practice" data-pt="${t.n}">Practice this topic (${t.q.length} questions)</a>
      ${t.n>1?`<button class="btn ghost" data-g="${t.n-1}">← Topic ${t.n-1}</button>`:""}
      ${t.n<T.length?`<button class="btn ghost" data-g="${t.n+1}">Topic ${t.n+1} →</button>`:""}
    </div>
  </article>`;
}
$("#v-guide").addEventListener("click", e=>{
  const g = e.target.closest("[data-g]"); if(g){ gTopic=+g.dataset.g; store("aio2-guide",gTopic); renderGuide(); window.scrollTo({top:0}); return; }
  const p = e.target.closest("[data-pt]"); if(p){ pTopic=+p.dataset.pt; }
});

/* ===== SHARED QUESTION RENDERING ===== */
function rubricHTML(q){ const r = RUB[q[1]]; return r ? `<p style="margin-top:8px"><b>Key points to hit:</b></p><ul>${r.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>` : ""; }
function qHTML(item, idx, mode){
  const [type, text] = item.q;
  const meta = `<span class="qmeta">Q${idx+1} · ${type==="mc"?"Multiple choice":type==="tf"?"True or false":"Short answer"}${mode==="exam"?" · Topic "+item.t.n:""}</span>`;
  if(type==="sa"){
    return `<div class="q" data-id="${item.id}">${meta}<p class="qtext">${esc(text)}</p>
      <label for="sa-${mode}-${item.id}" class="small">Write your answer, then compare with the model answer and key points.</label>
      <textarea id="sa-${mode}-${item.id}" rows="3"></textarea>
      <div class="row"><button class="btn ghost" data-reveal>Show model answer</button></div>
      <div class="model" hidden><b style="font-family:var(--display)">Model answer:</b> ${esc(item.q[2])}${rubricHTML(item.q)}</div></div>`;
  }
  return `<div class="q" data-id="${item.id}">${meta}<p class="qtext">${esc(text)}</p>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="k">${type==="tf"?"":L[i]}</span><span>${esc(o.text)}</span></button>`).join("")}</div>
    <div class="why" hidden></div></div>`;
}
function prep(item, doShuffle){
  const q=item.q;
  if(q[0]==="mc"){ let o=q[2].map((text,i)=>({text, ok:i===q[3]})); item.opts = doShuffle?shuffle(o):o; item.why=q[4]; }
  else if(q[0]==="tf"){ item.opts=[{text:"True",ok:q[2]===true},{text:"False",ok:q[2]===false}]; item.why=q[3]; }
  return item;
}

/* ===== PRACTICE ===== */
let pTopic = 1, pItems = [], pState = {};
function renderPractice(){
  const t = T.find(x=>x.n===pTopic);
  pItems = t.q.map((q,i)=>prep({t,q,id:t.n+"-"+i}, false)); pState = {};
  $("#v-practice").innerHTML = `
  <div><h1>Practice</h1><p class="lede">Pick a topic. Each answer shows right away with an explanation. Scores of 80% or more get a check mark in the study guide.</p></div>
  <div class="chips" role="group" aria-label="Topics">${T.map(x=>`<button class="chip" data-p="${x.n}" aria-pressed="${x.n===pTopic}">${pad(x.n)} ${esc(x.title)}</button>`).join("")}</div>
  <article class="card stack">
    <div class="row" style="justify-content:space-between"><h2>${pad(t.n)} · ${esc(t.title)}</h2><span class="score" id="p-score"></span></div>
    <div class="stack" id="p-qs">${pItems.map((it,i)=>qHTML(it,i,"practice")).join("")}</div>
    <div class="row"><button class="btn ghost" data-reset>Reset topic</button>${t.n<T.length?`<button class="btn" data-p="${t.n+1}">Next topic →</button>`:""}</div>
  </article>`;
  updPScore();
}
function updPScore(){
  const auto = pItems.filter(x=>x.q[0]!=="sa");
  const done = auto.filter(x=>pState[x.id]!==undefined).length;
  const right = auto.filter(x=>pState[x.id]===true).length;
  $("#p-score").textContent = `${right} / ${auto.length} correct · ${done} answered`;
  if(done===auto.length && auto.length){ const best=store("aio2-best")||{}; const pct=Math.round(right/auto.length*100); if(!(best[pTopic]>=pct)){ best[pTopic]=pct; store("aio2-best",best);} }
}
$("#v-practice").addEventListener("click", e=>{
  const p=e.target.closest("[data-p]"); if(p){ pTopic=+p.dataset.p; renderPractice(); window.scrollTo({top:0}); return; }
  if(e.target.closest("[data-reset]")){ renderPractice(); return; }
  const rv=e.target.closest("[data-reveal]"); if(rv){ rv.closest(".q").querySelector(".model").hidden=false; rv.remove(); return; }
  const o=e.target.closest(".opt"); if(!o) return;
  const qd=o.closest(".q"), it=pItems.find(x=>x.id===qd.dataset.id); if(pState[it.id]!==undefined) return;
  const i=+o.dataset.i, ok=it.opts[i].ok; pState[it.id]=ok;
  qd.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(it.opts[j].ok) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  const w=qd.querySelector(".why"); w.hidden=false; w.className="why "+(ok?"ok":"no");
  w.innerHTML=`<b>${ok?"Correct.":"Not quite. Answer: "+esc(it.opts.find(x=>x.ok).text)+"."}</b> ${esc(it.why)}`;
  updPScore();
});

/* ===== EXAM ===== */
let eItems=[], eAns={}, eDone=false;
function renderExamStart(){
  const last = store("aio2-exam");
  $("#v-exam").innerHTML = `
  <div><h1>Exam</h1><p class="lede">Mixed multiple-choice and true/false questions drawn at random from the topics you choose. No feedback until you submit; then you get a score, a breakdown by topic, and a full review.</p></div>
  <div class="card stack">
    <div class="row">
      <label class="sel" for="e-n">Questions
        <select id="e-n"><option value="15">15 (quick check)</option><option value="30" selected>30 (standard)</option><option value="60">60 (long)</option><option value="${totals.mc+totals.tf}">All ${totals.mc+totals.tf}</option></select></label>
      <label class="sel" for="e-t">Topics
        <select id="e-t"><option value="all">All 12</option><option value="1-6">1–6 (foundations)</option><option value="7-12">7–12 (search, people, economy)</option>${T.map(t=>`<option value="${t.n}-${t.n}">${pad(t.n)} ${esc(t.title)}</option>`).join("")}</select></label>
      <button class="btn" data-start>Start exam</button>
    </div>
    ${last?`<p class="small">Last result: ${last.r}/${last.n} (${Math.round(last.r/last.n*100)}%) on ${esc(last.d)}.</p>`:""}
  </div>`;
}
function startExam(){
  const n=+$("#e-n").value, tr=$("#e-t").value;
  const [a,b] = tr==="all"?[1,12]:tr.split("-").map(Number);
  const pool = allQ().filter(x=>x.q[0]!=="sa" && x.t.n>=a && x.t.n<=b);
  eItems = shuffle(pool).slice(0,n).sort((x,y)=>x.t.n-y.t.n).map(x=>prep(x,true)); eAns={}; eDone=false;
  $("#v-exam").innerHTML = `
  <div><h1>Exam</h1><p class="lede">${eItems.length} questions. Answer all, then submit.</p></div>
  <article class="card stack"><div class="stack" id="e-qs">${eItems.map((it,i)=>qHTML(it,i,"exam")).join("")}</div>
  <div class="row" style="justify-content:space-between"><span class="score" id="e-prog">0 / ${eItems.length} answered</span><button class="btn" data-submit>Submit exam</button></div></article>`;
  window.scrollTo({top:0});
}
function submitExam(){
  eDone=true; let r=0; const by={};
  eItems.forEach(it=>{
    const qd=document.querySelector(`#e-qs .q[data-id="${it.id}"]`), pick=eAns[it.id], ok=pick!==undefined && it.opts[pick].ok;
    if(ok) r++; by[it.t.n]=by[it.t.n]||{r:0,n:0,title:it.t.title}; by[it.t.n].n++; if(ok) by[it.t.n].r++;
    qd.querySelectorAll(".opt").forEach((b,j)=>{ b.disabled=true; if(it.opts[j].ok) b.classList.add("right"); else if(j===pick) b.classList.add("wrong"); });
    const w=qd.querySelector(".why"); w.hidden=false; w.className="why "+(ok?"ok":"no");
    w.innerHTML=`<b>${ok?"Correct.":(pick===undefined?"Skipped. ":"Wrong. ")+"Answer: "+esc(it.opts.find(x=>x.ok).text)+"."}</b> ${esc(it.why)}`;
  });
  const pct=Math.round(r/eItems.length*100);
  store("aio2-exam",{r,n:eItems.length,d:new Date().toLocaleDateString()});
  const weak = Object.entries(by).filter(([,v])=>v.r/v.n<0.7).map(([k,v])=>`${k} ${v.title}`);
  const res=document.createElement("div"); res.className="card stack";
  res.innerHTML=`<div class="row" style="gap:20px;align-items:flex-end"><span class="big">${pct}%</span><span class="score">${r} of ${eItems.length} correct</span></div>
   <div class="bars">${Object.entries(by).map(([k,v])=>`<div class="bar"><span class="t">${pad(k)} ${esc(v.title)}</span><span class="track"><span class="fill" style="width:${Math.round(v.r/v.n*100)}%"></span></span><span class="v">${v.r}/${v.n}</span></div>`).join("")}</div>
   <p class="tip">${weak.length?"Review these topics in the study guide: "+esc(weak.join(", "))+".":"Every topic at 70% or above. Try the long exam or the short-answer questions in Practice next."}</p>
   <div class="row"><button class="btn" data-again>New exam</button><a class="btn ghost" href="#guide">Back to study guide</a></div>`;
  $("#v-exam").insertBefore(res, $("#v-exam").children[1]);
  document.querySelector("[data-submit]").remove();
  window.scrollTo({top:0});
}
$("#v-exam").addEventListener("click", e=>{
  if(e.target.closest("[data-start]")){ startExam(); return; }
  if(e.target.closest("[data-again]")){ renderExamStart(); window.scrollTo({top:0}); return; }
  if(e.target.closest("[data-submit]")){ submitExam(); return; }
  const o=e.target.closest(".opt"); if(!o||eDone) return;
  const qd=o.closest(".q"); eAns[qd.dataset.id]=+o.dataset.i;
  qd.querySelectorAll(".opt").forEach(b=>b.setAttribute("aria-pressed", b===o?"true":"false"));
  $("#e-prog").textContent=`${Object.keys(eAns).length} / ${eItems.length} answered`;
});

/* ===== ANSWER KEY ===== */
function keyText(){
  let n=0;
  const qs = T.map(t=>`TOPIC ${t.n}: ${t.title.toUpperCase()}\n`+t.q.map(q=>{ n++;
    if(q[0]==="mc") return `${n}. ${q[1]}\n${q[2].map((o,j)=>`   ${L[j]}) ${o}`).join("\n")}`;
    if(q[0]==="tf") return `${n}. True or false: ${q[1]}`;
    return `${n}. Short answer: ${q[1]}`; }).join("\n\n")).join("\n\n\n");
  n=0;
  const ans = T.map(t=>`TOPIC ${t.n}: ${t.title.toUpperCase()}\n`+t.q.map(q=>{ n++;
    if(q[0]==="mc") return `${n}. ${L[q[3]]}) ${q[2][q[3]]}. ${q[4]}`;
    if(q[0]==="tf") return `${n}. ${q[2]?"True":"False"}. ${q[3]}`;
    return `${n}. Model answer: ${q[2]}\n   Key points: ${(RUB[q[1]]||[]).join("; ")}`; }).join("\n")).join("\n\n");
  return `AI OVERVIEW TEST BANK (Team Max XP, V1.0)\n\nQUESTIONS\n\n${qs}\n\n\nANSWER KEY\n\n${ans}`;
}
function renderKey(){
  let n=0;
  $("#v-key").innerHTML = `
  <div><h1>Answer key</h1><p class="lede">The full test bank with answers, explanations, model answers and key points, grouped by topic. Copy it as plain text (questions first, answers after) to paste into a Google Form or a document.</p></div>
  <div class="row"><button class="btn" data-copy>Copy test bank as text</button><span class="small" id="k-msg" aria-live="polite"></span></div>
  <textarea id="k-fallback" rows="6" hidden readonly style="font-family:var(--mono);font-size:13px"></textarea>
  ${T.map(t=>`<article class="card stack" style="gap:12px"><span class="eyebrow">Topic ${pad(t.n)}</span><h2>${esc(t.title)}</h2>
   <ol class="keylist" start="${n+1}">${t.q.map(q=>{ n++;
     if(q[0]==="mc") return `<li>${esc(q[1])}<br><span class="ans">${L[q[3]]}) ${esc(q[2][q[3]])}</span> <span class="small">${esc(q[4])}</span></li>`;
     if(q[0]==="tf") return `<li><i>True or false:</i> ${esc(q[1])}<br><span class="ans">${q[2]?"True":"False"}</span> <span class="small">${esc(q[3])}</span></li>`;
     return `<li><i>Short answer:</i> ${esc(q[1])}<br><span class="small"><b>Model answer:</b> ${esc(q[2])}</span>${RUB[q[1]]?`<ul>${RUB[q[1]].map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</li>`;
   }).join("")}</ol></article>`).join("")}`;
}
$("#v-key").addEventListener("click", e=>{
  if(!e.target.closest("[data-copy]")) return;
  const txt=keyText(), msg=$("#k-msg"), fb=$("#k-fallback");
  const fallback=()=>{ fb.hidden=false; fb.value=txt; fb.focus(); fb.select(); msg.textContent="Text selected below. Press Ctrl+C (or ⌘C) to copy."; };
  try{ navigator.clipboard.writeText(txt).then(()=>{ msg.textContent="Copied the full test bank."; }, fallback); }catch(err){ fallback(); }
});

/* ===== ROUTER ===== */
const views=["about","guide","practice","exam","key"];
function route(){
  const v = views.includes(location.hash.slice(1)) ? location.hash.slice(1) : "about";
  views.forEach(x=>{ $("#v-"+x).hidden = x!==v; });
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.getAttribute("href")==="#"+v?"page":"false"));
  if(v==="about" && !$("#v-about").innerHTML) renderAbout();
  if(v==="guide") renderGuide();
  if(v==="practice") renderPractice();
  if(v==="exam" && !eItems.length) renderExamStart();
  if(v==="key" && !$("#v-key").innerHTML) renderKey();
  window.scrollTo({top:0});
}
window.addEventListener("hashchange", route);
route();
</script>

</body></html>
