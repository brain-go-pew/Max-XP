<style>
/* Layout: a search-results page turned into a study desk. Narrow reading column, citation-style chips, highlighter marks for key numbers. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --soft:#eaeef5; --ink:#152030; --muted:#5b6778; --line:#d7dde6;
  --accent:#1f5fd1; --accent-ink:#ffffff; --mark:#fff0a0; --good:#1d7a4d; --good-bg:#e3f4ea; --bad:#b42318; --bad-bg:#fbe7e5;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#161d27; --soft:#1d2633; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2a3443;
  --accent:#7ea8ff; --accent-ink:#0e131a; --mark:#4b4318; --good:#5cc98f; --good-bg:#153024; --bad:#ff8a80; --bad-bg:#3a1a19; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#161d27; --soft:#1d2633; --ink:#e6ebf2; --muted:#9aa5b5; --line:#2a3443;
  --accent:#7ea8ff; --accent-ink:#0e131a; --mark:#4b4318; --good:#5cc98f; --good-bg:#153024; --bad:#ff8a80; --bad-bg:#3a1a19; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:12px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:14px;margin-left:6px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{font-family:var(--display);font-weight:500;font-size:15px;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:999px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:28px 64px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em}
h2{font-size:26px;font-weight:700}
p{margin:0}
.lede{color:var(--muted);max-width:64ch;margin-top:8px}
.stack{display:flex;flex-direction:column;gap:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 10px;border-radius:6px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .done{color:var(--good);margin-left:4px}
.chip[aria-pressed="true"] .done{color:inherit}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-family:var(--display);font-weight:700;font-size:15px;border:1px solid var(--ink);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
/* rich notes */
.notes{min-width:0}
.notes h3{font-family:var(--display);font-size:19px;font-weight:700;margin:26px 0 10px}
.notes p{margin:0 0 10px;max-width:72ch}
.notes ul,.notes ol{margin:0 0 12px;padding-left:22px;max-width:72ch}
.notes li{margin-bottom:5px}
.tblwrap{overflow-x:auto;margin:6px 0 14px}
.notes table.tbl{border-collapse:collapse;width:100%;font-size:15px;line-height:1.45;min-width:480px}
.notes .tbl th{font-family:var(--display);text-align:left;background:var(--soft);padding:8px 10px;border-bottom:1px solid var(--ink)}
.notes .tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.notes .ex{background:var(--soft);border-left:3px solid var(--accent);padding:10px 14px;margin:10px 0 14px;border-radius:0 6px 6px 0;font-size:16px;max-width:76ch}
.notes .recap{border:1.5px solid var(--ink);border-radius:8px;padding:12px 16px;margin:22px 0 10px}
.notes .recap>p:first-child b,.notes .recap>b{font-family:var(--display);text-transform:uppercase;letter-spacing:.06em;font-size:14px}
.notes .recap ul{margin:6px 0 0}
.notes .act{border:1.5px solid var(--accent);border-radius:8px;padding:4px 16px 8px;margin:22px 0 10px}
.notes .act h3{color:var(--accent);margin:12px 0 8px}
.notes .act-item{margin-bottom:12px}
.notes .act-item p{margin:0 0 4px}
.notes .act-n{font-size:15px;color:var(--muted)}
.notes dl{margin:0;display:grid;grid-template-columns:minmax(120px,210px) 1fr;gap:6px 18px;font-size:16px}
.notes dt{font-family:var(--display);font-weight:700}
.notes dd{margin:0;min-width:0}
@media (max-width:560px){.notes dl{grid-template-columns:1fr;gap:2px}.notes dd{margin-bottom:8px}}
.notes .url{font-family:var(--mono);font-size:13px;word-break:break-all}
.notes .res{margin-bottom:18px}
.notes .res-t{margin-bottom:6px}
.notes .refs{font-size:15px}
.mtbl{border-collapse:collapse;width:100%;font-size:15px;min-width:600px}
.mtbl th{font-family:var(--display);text-align:left;background:var(--soft);padding:8px 10px;border-bottom:1px solid var(--ink)}
.mtbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.mtbl .id{font-family:var(--mono);font-size:14px}
/* quiz */
.q{display:flex;flex-direction:column;gap:12px}
.q + .q{border-top:1px solid var(--line);padding-top:20px}
.qmeta{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qtext{font-weight:600;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:16px;line-height:1.45;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer}
.opt .k{font-family:var(--mono);font-size:13px;color:var(--muted);padding-top:2px;flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:15.5px;background:var(--bg);border-radius:8px;padding:10px 14px;max-width:74ch}
.why b{font-family:var(--display)}
.why.ok b{color:var(--good)} .why.no b{color:var(--bad)}
.model{font-size:15.5px;border:1px dashed var(--line);border-radius:8px;padding:10px 14px;max-width:74ch}
.model ul{margin:4px 0 0;padding-left:20px}
textarea{font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.score{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,220px) 1fr 56px;gap:10px;align-items:center;font-size:14px}
.bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);display:block}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
select{font:inherit;font-size:15px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
label.sel{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:15px}
.keylist{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:10px}
.keylist li{max-width:74ch}
.keylist .ans{color:var(--good);font-weight:600}
.keylist ul{margin:4px 0 0;padding-left:20px;font-size:15px}
.small{font-size:14px;color:var(--muted)}
.tip{border-left:3px solid var(--accent);padding:4px 0 4px 14px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.opt,.chip{transition:background .12s,border-color .12s}}
</style>

<script>
const DATA = {"T":[{"n":1,"title":"The Big Picture","sum":"What AI Overviews are, and why search engines started writing answers instead of listing links.","html":"<h3>What an AI Overview is<\/h3>\n<p>An <b>AI Overview<\/b> is a short AI-written answer at the top of search results, with links to the sources it used. Search tools that work this way are called <b>answer engines<\/b>: they read the web for you and write a direct answer, instead of only showing a list of blue links.<\/p>\n<ul>\n<li><b>Google:<\/b> AI Overviews (appear automatically at the top of results) and AI Mode (a conversational, multi-turn search).<\/li>\n<li><b>Others:<\/b> Perplexity, ChatGPT search, Microsoft Copilot, Gemini.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Example.<\/b> Searching \"best laptop for video editing under $1,000\" in classic search gives ten review sites to compare. AI Mode instead writes a short comparison with recommended models and cites the reviews it used.<\/div>\n\n<h3>How big it is<\/h3>\n<ul>\n<li>Google says AI Overviews reach <b>2 billion+ monthly users in 200+ countries<\/b> (some 2026 reports cite 2.5 billion).<\/li>\n<li>Google AI Mode passed <b>1 billion monthly users<\/b> in 2026.<\/li>\n<li>ChatGPT has <b>more than 1 billion weekly users<\/b> (2026).<\/li>\n<\/ul>\n\n<h3>Why answer engines exist<\/h3>\n<table class=\"tbl\"><tr><th>Reason<\/th><th>Evidence<\/th><\/tr>\n<tr><td><b>People want answers, not homework<\/b><\/td><td>About half of ChatGPT messages are \"Asking\" for advice or information to help decide something. People want a direct answer they can act on.<\/td><\/tr>\n<tr><td><b>Questions got harder<\/b><\/td><td>AI Mode queries are about 3× longer than classic searches, and 1 in 5 uses voice, images or documents. Ten blue links don't answer those well.<\/td><\/tr>\n<tr><td><b>The prize: owning the answer<\/b><\/td><td>Whoever controls AI answers controls a huge share of online attention, advertising and shopping. That's why tech companies are investing hundreds of billions of dollars.<\/td><\/tr>\n<\/table>\n\n<h3>The catch<\/h3>\n<p>A Pew Research study of 68,879 Google searches found people clicked a regular result in only <b>8%<\/b> of visits when an AI summary appeared, vs <b>15%<\/b> without one, and clicked a link inside the summary just <b>1%<\/b> of the time. Answers are convenient, but they change who gets visited (websites lose traffic) and who must be trusted (the AI, not the source).<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 1.1 · Compare the two ways of searching<\/b><\/p><p>Search one real question (e.g. \"Should I rent or buy a laptop for university?\") in classic search and in an AI answer tool (Google AI Mode, Perplexity or ChatGPT search). Note: how many sources each shows, how long it took to get an answer, and whether you clicked any link.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Most people click nothing in the AI version. Ask yourself: which sources lost a visit, and whose word are you now trusting?<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 1.2 · Predict, then check<\/b><\/p><p>Guess what share of your own searches end without a click. Then look at your last 10 searches in your history and count.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Compare your number with Pew's 8% click rate when an AI summary appears.<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>An AI Overview = AI-written answer + source links; tools like this are answer engines.<\/li>\n<li>Three drivers: users want answers, questions are longer and multimodal, and owning the answer is commercially valuable.<\/li>\n<li>The cost: fewer clicks for websites, and more trust placed in the AI.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>AI Overview<\/dt><dd>Google's AI-written summary at the top of results, with source links.<\/dd>\n<dt>Answer engine<\/dt><dd>A search tool that writes an answer instead of only listing links.<\/dd>\n<dt>AI Mode<\/dt><dd>Google's conversational, multi-turn AI search.<\/dd>\n<\/dl><\/div>","q":[["mc","What is an AI Overview?",["A chatbot that never uses the web","A short AI-written answer at the top of results, with links to its sources","A paid ad shown above search results","A list of the ten most popular websites"],1,"It is a written summary plus source links. Tools that work this way are called answer engines."],["mc","Which of these is NOT an answer engine?",["Perplexity","ChatGPT search","Microsoft Copilot","BM25"],3,"BM25 is a classic keyword-ranking formula, not an answer engine."],["mc","According to Pew, when an AI summary appeared, users clicked a regular result in about what share of visits?",["8%","1%","15%","45%"],0,"8% with a summary vs 15% without one."],["mc","How do AI Mode queries compare with classic searches?",["About the same length","About 3× longer","About half as long","About 10× longer"],1,"They are roughly 3× longer, and 1 in 5 uses voice, images or documents."],["mc","Why are tech companies investing hundreds of billions in AI answers?",["Whoever controls the answer controls attention, advertising and shopping","Because governments require it","Because AI answers are cheaper to run than links","To replace all websites"],0,"\"Owning the answer\" is the commercial prize."],["mc","About what share of ChatGPT messages are \"Asking\" for advice or information?",["About half","About a quarter","Almost all","About 4%"],0,"About half are \"Asking\", more than \"Doing\" or \"Expressing\"."],["mc","Roughly how many Google searches did Pew's AI summary study analyze?",["About 68,879","About 6,800","About 680","About 6.8 million"],0,"Pew studied 68,879 Google searches."],["mc","In Pew's study, how often did users click a link inside the AI summary itself?",["8% of visits","15% of visits","1% of visits","30% of visits"],2,"Only 1%, which shows how rarely people check sources."],["tf","Answer engines show a written answer without any sources.",false,"They show the answer plus links/citations to the sources used."],["tf","About 1 in 5 AI Mode queries uses voice, images or documents.",true,"That's one reason ten blue links stopped being enough."],["sa","Give the three reasons search engines started writing answers, and the main catch.","1) Users want direct answers (about half of ChatGPT messages are Asking). 2) Questions got longer and multimodal (AI Mode queries ~3× longer; 1 in 5 uses voice/images/docs). 3) Commercial prize: owning the answer controls attention, ads and shopping. Catch: fewer clicks to websites (8% vs 15%) and users must trust the AI."],["sa","Using the laptop example, contrast classic search and AI Mode.","Classic search returns a ranked list of review sites the user must open and compare. AI Mode reads those reviews, writes a short comparison with recommended models, and cites the reviews it used."]]},{"n":2,"title":"From Links to Answers","sum":"Search went from matching keywords, to understanding questions, to writing the answer itself.","html":"<h3>Classic search vs AI search<\/h3>\n<table class=\"tbl\"><tr><th><\/th><th>Classic search<\/th><th>AI search<\/th><\/tr>\n<tr><td><b>You get<\/b><\/td><td>A ranked list of links<\/td><td>A written answer + citations<\/td><\/tr>\n<tr><td><b>Who does the reading<\/b><\/td><td>You<\/td><td>The AI<\/td><\/tr>\n<tr><td><b>Queries run behind the scenes<\/b><\/td><td>Usually one<\/td><td>Often many (\"fan-out\")<\/td><\/tr>\n<tr><td><b>Follow-up questions<\/b><\/td><td>Start a new search<\/td><td>Continue the conversation<\/td><\/tr>\n<tr><td><b>Main risk<\/b><\/td><td>Low-quality pages<\/td><td>Confident but wrong answers<\/td><\/tr>\n<\/table>\n\n<h3>How search engines evolved<\/h3>\n<table class=\"tbl\"><tr><th>Era<\/th><th>What changed<\/th><\/tr>\n<tr><td><b>Classic era: keyword matching<\/b><\/td><td>Search engines crawl the web, store pages in an index, and rank the links that contain your words, using formulas such as <b>BM25<\/b>.<\/td><\/tr>\n<tr><td><b>2016 → instant answers<\/b><\/td><td>Weather boxes and featured snippets answer on the results page. About <b>45%<\/b> of US Google searches already ended without a click.<\/td><\/tr>\n<tr><td><b>2019: understanding<\/b><\/td><td>Google adds <b>BERT<\/b> (October 2019), which reads the whole query in context. It affected about <b>1 in 10<\/b> US English searches. (See Topic 5 for the Brazil visa example.)<\/td><\/tr>\n<tr><td><b>May 2024: AI Overviews<\/b><\/td><td>AI-written summaries roll out to all US Google users.<\/td><\/tr>\n<tr><td><b>2026: conversation and agents<\/b><\/td><td>AI Mode passes 1 billion users; assistants start to compare and buy products for you (see Topic 12).<\/td><\/tr>\n<\/table>\n\n<h3>Zero-click search is rising<\/h3>\n<p>A <b>zero-click search<\/b> is one where the user gets what they need on the results page and clicks nothing. Share of US Google searches ending with no click: <b>~45% (2016) → 60.45% (2024) → 68.01% (early 2026)<\/b>.<\/p>\n\n<h3>The pattern behind every step<\/h3>\n<p>Each step moved more of the work from the user to the search engine: first <b>finding<\/b> pages (keyword search), then <b>understanding<\/b> the question (BERT), now <b>reading and summarizing<\/b> the sources (AI Overviews), and next <b>acting<\/b> for the user (agents).<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 2.1 · Timeline card sort (paper)<\/b><\/p><p>Write five cards: keyword matching (BM25), featured snippets (2016), BERT (2019), AI Overviews (May 2024), agents (2026). Shuffle, put them in order, and under each write what work moved from you to the search engine.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Finding → understanding → reading and summarizing → acting.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 2.2 · Keywords vs a full question (try with a chatbot or search engine)<\/b><\/p><p>Search \"visa brazil usa 2019\", then \"2019 brazil traveler to usa need a visa\". Compare the top results.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> The small word \"to\" changes the meaning. This is the BERT example from Topic 5.<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>Classic search: you read; AI search: the AI reads, runs many queries, and writes.<\/li>\n<li>Timeline: keywords → instant answers (2016) → BERT (2019) → AI Overviews (May 2024) → agents (2026).<\/li>\n<li>Zero-click searches grew from ~45% to 68%.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>Index<\/dt><dd>The giant stored copy of web pages a search engine searches.<\/dd>\n<dt>BM25<\/dt><dd>Classic keyword-matching ranking algorithm.<\/dd>\n<dt>Featured snippet<\/dt><dd>A quoted answer box shown above the links.<\/dd>\n<dt>BERT<\/dt><dd>Google's 2019 language model that reads queries in context.<\/dd>\n<dt>Query fan-out<\/dt><dd>Splitting one question into many sub-searches run in parallel.<\/dd>\n<dt>Zero-click search<\/dt><dd>A search that ends without clicking any result.<\/dd>\n<\/dl><\/div>","q":[["mc","In classic search, who reads the source pages?",["The AI","The user","The advertiser","Nobody"],1,"In AI search the AI reads; in classic search you do."],["mc","What is the main risk of AI search, compared with classic search?",["Confident wrong answers","Slow loading","Low-quality pages in the list","Too many ads"],0,"Classic search's main risk is low-quality pages; AI search's is confident wrong answers."],["mc","In what year did BERT start helping Google understand whole queries?",["2016","2024","2019","2012"],2,"2019, affecting about 1 in 10 US English searches."],["mc","When did AI Overviews roll out to all US Google users?",["May 2024","January 2026","May 2019","Never"],0,"May 2024."],["mc","Roughly what share of US Google searches ended with no click in early 2026?",["15%","45%","90%","68%"],3,"About 68%, up from ~45% in 2016."],["mc","What does \"query fan-out\" mean?",["Sending a query to many users","Splitting one question into many sub-queries run at once","Showing results in a fan-shaped layout","Deleting old queries"],1,"Complex questions are broken into sub-queries that run in parallel."],["mc","Which of these is the correct order of search eras?",["BERT → keyword matching → AI Overviews → instant answers","Instant answers → AI Overviews → keyword matching → BERT","Keyword matching → instant answers → BERT → AI Overviews","AI Overviews → BERT → keyword matching → instant answers"],2,"Keyword matching → instant answers (2016) → BERT (2019) → AI Overviews (May 2024) → agents (2026)."],["tf","Featured snippets and instant answers existed before AI Overviews.",true,"They started around 2016; ~45% of searches already ended without a click."],["tf","Classic search usually runs many queries for each question.",false,"Classic search usually runs one; AI search often runs many (fan-out)."],["sa","Explain how each era of search shifted work from the user to the search engine.","Classic keyword search took over finding pages. BERT-era understanding took over interpreting the question. AI Overviews/AI Mode take over reading and summarizing the sources, and agents are starting to act (compare, buy)."],["sa","Fill in the timeline: what happened in 2016, 2019, May 2024 and 2026?","2016: instant answers and featured snippets (~45% zero-click). 2019: BERT reads whole queries in context (~1 in 10 US English searches). May 2024: AI Overviews roll out to all US users. 2026: AI Mode passes 1B users and assistants start comparing and buying for users."]]},{"n":3,"title":"Machine Learning & Deep Learning","sum":"Machine learning is the core idea behind every AI system in this guide. Everything else is a way of learning (supervised, unsupervised, reinforcement), a type of model (deep neural networks), or a place ML is applied (prediction, vision, robots).","html":"<h3>3.1 Introduction to machine learning<\/h3>\n<p><b>What it is.<\/b> A branch of AI where computers learn patterns from data instead of following rules a programmer writes by hand. The term comes from IBM researcher <b>Arthur Samuel<\/b>, whose 1959 paper described a checkers program that got better the more it played. It played thousands of games against itself and beat a strong human player in <b>1962<\/b>.<\/p>\n<table class=\"tbl\"><tr><th>Traditional programming<\/th><th>Machine learning<\/th><\/tr><tr><td>Rules + data → answers<\/td><td>Data + answers → rules<\/td><\/tr><\/table>\n<p><b>The training loop:<\/b><\/p>\n<ol>\n<li><b>Collect data<\/b>: examples of the problem.<\/li>\n<li><b>Pick a model<\/b>: a math function with adjustable settings called <b>parameters<\/b>.<\/li>\n<li><b>Train<\/b>: the model makes predictions, a <b>loss function<\/b> scores how wrong they are, and an <b>optimizer<\/b> nudges the parameters to reduce the error. Repeat thousands of times.<\/li>\n<li><b>Test<\/b> on data the model has never seen, to check it learned the pattern rather than memorizing it (<b>overfitting<\/b>).<\/li>\n<li><b>Deploy and monitor<\/b>, because real-world data drifts over time.<\/li>\n<\/ol>\n<p><b>Why it matters.<\/b> ML powers search ranking, recommendations, spam filters, translation and chatbots. Stanford's 2026 AI Index: generative AI reached <b>53% adoption within three years<\/b>, faster than the PC or the internet; US private AI investment was about <b>$286 billion<\/b> in 2025.<\/p>\n\n\n<p><b>Where ML fits.<\/b> <b>Artificial intelligence<\/b> is the broad goal of machines doing tasks that need human-like intelligence. <b>Machine learning<\/b> is the main way to get there today (learning from data). <b>Deep learning<\/b> is ML with many-layered neural networks (3.5), and <b>generative AI<\/b> is deep learning that creates new content (Topic 4). Every system in use today is <b>narrow AI<\/b>: good at specific tasks. <b>Artificial general intelligence (AGI)<\/b>, AI as capable as people across almost all tasks, does not exist yet and its timing is debated.<\/p>\n<table class=\"tbl\"><tr><th>Parameters<\/th><th>Hyperparameters<\/th><\/tr>\n<tr><td>Learned by the model during training (weights, biases)<\/td><td>Chosen by people before training (learning rate, number of layers, k in k-means, tree depth)<\/td><\/tr>\n<tr><td>Example: the w and b in y = w·x + b<\/td><td>Tuned by trying values and checking the <b>validation set<\/b><\/td><\/tr><\/table>\n<p><b>Data comes first.<\/b> Most of the work in real ML projects is collecting, cleaning and labeling data: fixing missing values, removing duplicates, and checking the data represents everyone the model will be used on. Bad data creates bad and biased models (Topic 9).<\/p>\n<h3>3.2 Supervised learning<\/h3>\n<p><b>What it is.<\/b> The model learns from <b>labeled<\/b> examples: each input (<b>features<\/b>) comes with the correct answer (<b>label<\/b>). Data is split into a <b>training set<\/b> (to learn), a <b>validation set<\/b> (to tune) and a <b>test set<\/b> (to check final performance).<\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Classification<\/th><th>Regression<\/th><\/tr>\n<tr><td><b>Predicts<\/b><\/td><td>A category (spam / not spam)<\/td><td>A number (price, temperature)<\/td><\/tr>\n<tr><td><b>Algorithms<\/b><\/td><td>Logistic regression, decision trees, random forest, SVM, neural networks<\/td><td>Linear regression, decision trees, gradient boosting, neural networks<\/td><\/tr>\n<tr><td><b>Scored by<\/b><\/td><td>Accuracy, precision, recall, F1<\/td><td>MAE, MSE, R²<\/td><\/tr>\n<tr><td><b>Example<\/b><\/td><td>Spam filter, diagnosis from scans<\/td><td>House-price estimate, sales forecast<\/td><\/tr><\/table>\n<ul>\n<li><b>Classification:<\/b> the model outputs a probability for each class; a <b>threshold<\/b> turns it into a decision (\"spam if probability &gt; 0.5\"). Results go in a <b>confusion matrix<\/b> (true/false positives and negatives).<\/li>\n<li><b>Precision<\/b> = of the emails flagged as spam, how many really were? <b>Recall<\/b> = of all real spam, how much did we catch? Raising the threshold usually <b>raises precision but lowers recall<\/b>.<\/li>\n<li><b>Regression:<\/b> fits a line or curve. Linear regression fits <b>y = w·x + b<\/b>, adjusting weight w and bias b with gradient descent until the average squared error is smallest.<\/li>\n<\/ul>\n<p><b>Why it matters.<\/b> Most business ML is supervised: fraud detection, credit scoring, diagnosis, demand forecasting. Main limit: someone has to label the data, which can take thousands of human hours.<\/p>\n<div class=\"ex\"><b>Example.<\/b> A bank trains a classifier on past transactions labeled \"fraud\" or \"legit.\" A new card payment is scored in milliseconds and risky ones are blocked.<\/div>\n\n\n<p><b>Worked example: the confusion matrix.<\/b> A spam filter checks 100 emails, of which 20 are really spam.<\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Predicted spam<\/th><th>Predicted not spam<\/th><\/tr>\n<tr><td><b>Actually spam (20)<\/b><\/td><td>True positives (TP) = 15<\/td><td>False negatives (FN) = 5 (missed spam)<\/td><\/tr>\n<tr><td><b>Actually not spam (80)<\/b><\/td><td>False positives (FP) = 3 (good email blocked)<\/td><td>True negatives (TN) = 77<\/td><\/tr><\/table>\n<ul>\n<li><b>Accuracy<\/b> = (TP + TN) ÷ total = (15 + 77) ÷ 100 = <b>92%<\/b><\/li>\n<li><b>Precision<\/b> = TP ÷ (TP + FP) = 15 ÷ 18 = <b>83%<\/b><\/li>\n<li><b>Recall<\/b> = TP ÷ (TP + FN) = 15 ÷ 20 = <b>75%<\/b><\/li>\n<li><b>F1 score<\/b> = 2 × precision × recall ÷ (precision + recall) ≈ <b>0.79<\/b>. It balances the two in one number.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Why accuracy alone can mislead.<\/b> If only 1% of transactions are fraud, a model that always says \"not fraud\" is 99% accurate but catches nothing (recall = 0). For rare events, look at precision and recall. Which error is worse depends on the job: missing cancer (false negative) is worse than an extra check (false positive), while a spam filter should avoid blocking real email (false positive).<\/div>\n\n<p><b>Common supervised algorithms in plain words:<\/b><\/p>\n<table class=\"tbl\"><tr><th>Algorithm<\/th><th>How it works<\/th><th>Good for<\/th><\/tr>\n<tr><td>Linear regression<\/td><td>Fits a straight line through the data<\/td><td>Simple number predictions<\/td><\/tr>\n<tr><td>Logistic regression<\/td><td>Squeezes a weighted sum into a probability between 0 and 1<\/td><td>Yes/no decisions; easy to explain<\/td><\/tr>\n<tr><td>Decision tree<\/td><td>A flowchart of yes/no questions (\"income &gt; $50K?\") that ends in a prediction<\/td><td>Very easy to explain; can overfit<\/td><\/tr>\n<tr><td>Random forest<\/td><td>Hundreds of trees trained on random samples of the data; they vote<\/td><td>Accurate and robust on tables of data<\/td><\/tr>\n<tr><td>Gradient boosting (XGBoost, LightGBM)<\/td><td>Trees added one by one, each fixing the last one's mistakes<\/td><td>Often the best choice for tabular business data<\/td><\/tr>\n<tr><td>k-nearest neighbors (kNN)<\/td><td>Looks at the k most similar past examples and copies their answer<\/td><td>Simple recommendations, small datasets<\/td><\/tr>\n<tr><td>Support vector machine (SVM)<\/td><td>Draws the widest possible boundary between classes<\/td><td>Smaller datasets with clear separation<\/td><\/tr>\n<tr><td>Neural network<\/td><td>Layers of weighted neurons (3.5)<\/td><td>Images, text, audio, huge datasets<\/td><\/tr><\/table>\n\n<p><b>Overfitting vs underfitting.<\/b><\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Underfitting<\/th><th>Good fit<\/th><th>Overfitting<\/th><\/tr>\n<tr><td><b>What happens<\/b><\/td><td>Model too simple; misses the pattern<\/td><td>Learns the real pattern<\/td><td>Model memorizes noise in the training data<\/td><\/tr>\n<tr><td><b>Training score<\/b><\/td><td>Poor<\/td><td>Good<\/td><td>Excellent<\/td><\/tr>\n<tr><td><b>Test score<\/b><\/td><td>Poor<\/td><td>Good<\/td><td>Poor<\/td><\/tr>\n<tr><td><b>Analogy<\/b><\/td><td>Didn't study<\/td><td>Understood the topic<\/td><td>Memorized last year's answers<\/td><\/tr><\/table>\n<p>This is the <b>bias–variance trade-off<\/b>: too simple = high bias (underfit); too sensitive to the training data = high variance (overfit). <b>Ways to prevent overfitting:<\/b> more (and more varied) data; simpler models; <b>regularization<\/b> (penalizing very large weights); <b>dropout<\/b> (randomly switching off neurons during training); <b>early stopping<\/b> (stop when validation error starts rising); and <b>k-fold cross-validation<\/b>: split the data into k parts, train on k−1 and test on the remaining one, rotate k times, and average the scores for a fairer estimate.<\/p>\n<h3>3.3 Unsupervised learning<\/h3>\n<p><b>What it is.<\/b> The model gets data with <b>no labels<\/b> and finds structure itself. IBM groups it into three tasks. It matters because most real-world data is unlabeled and labeling is expensive.<\/p>\n<p><b>Clustering<\/b> groups similar points. <b>k-means:<\/b> (1) choose k groups; (2) place k centroids at random; (3) assign each point to its nearest centroid; (4) move each centroid to the average of its points; (5) repeat 3–4 until groups stop changing. <i>Other methods:<\/i> hierarchical clustering (a tree of nested groups) and DBSCAN (finds dense regions, labels isolated points as noise, doesn't need k). <i>Example:<\/i> an online store segments shoppers into \"frequent small buyers\" and \"rare big spenders.\"<\/p>\n<p><b>Association<\/b> (\"market basket analysis\") finds rules like \"customers who buy X also buy Y,\" usually with the <b>Apriori<\/b> algorithm. A rule {A} → {B} is judged by:<\/p>\n<ul>\n<li><b>Support:<\/b> how often A and B appear together across all baskets.<\/li>\n<li><b>Confidence:<\/b> of baskets with A, the share that also have B.<\/li>\n<li><b>Lift:<\/b> confidence ÷ how common B is anyway. Lift &gt; 1 means A really raises the chance of B; lift = 1 means no link.<\/li>\n<\/ul>\n<div class=\"ex\"><b>Worked example.<\/b> 75% of baskets with bread contain butter, but butter is in 70% of all baskets anyway. Lift = 0.75 ÷ 0.70 ≈ <b>1.07<\/b>, a weak link. A rule with lift 4 or 5 is worth acting on (shelf placement, bundles).<\/div>\n<p><b>Dimensionality reduction<\/b> shrinks many features into a few while keeping most information. <b>PCA<\/b> keeps the directions where data varies most; <b>t-SNE<\/b> and <b>UMAP<\/b> are non-linear methods for plotting data in 2D. <i>Example:<\/i> a 50-question survey reduced to 2–3 components (\"price sensitivity,\" \"brand loyalty\").<\/p>\n\n<h3>3.4 Reinforcement learning (RL)<\/h3>\n<p><b>What it is.<\/b> An <b>agent<\/b> learns by trial and error: it acts in an <b>environment<\/b>, gets a <b>reward<\/b> or penalty, and learns a <b>policy<\/b> (strategy) that earns the most reward over time. No labeled answers, only feedback.<\/p>\n<p><b>The RL loop:<\/b> observe the state → pick an action using the policy → environment returns a reward and new state → update the policy toward higher total reward → repeat, often millions of times in simulation.<\/p>\n<ul>\n<li><b>Exploration vs exploitation:<\/b> try new moves, or stick with what works.<\/li>\n<li><b>Delayed reward:<\/b> a chess sacrifice only pays off many moves later.<\/li>\n<li><b>Algorithms:<\/b> Q-learning, Deep Q-Networks (DQN), PPO.<\/li>\n<li><b>Uses:<\/b> games, robot movement, traffic-light timing, data-center cooling, and aligning chatbots with <b>RLHF<\/b> (humans rank answers → a reward model learns their preferences → the language model is tuned to score well).<\/li>\n<\/ul>\n<div class=\"ex\"><b>Example.<\/b> DeepMind's <b>AlphaGo<\/b> beat world champion Lee Sedol <b>4–1<\/b> in Seoul in March 2016, using neural networks plus self-play. Its successor <b>AlphaGo Zero<\/b> learned purely by playing itself, with no human games.<\/div>\n<p><b>Watch out for reward hacking:<\/b> the agent finds a loophole. A boat-racing agent learned to spin in circles collecting bonus points instead of finishing the race.<\/p>\n\n<h3>3.5 Deep learning and neural networks<\/h3>\n<p><b>What it is.<\/b> ML with artificial neural networks that have many layers (\"deep\" = many layers). Each layer learns a more abstract view: <b>edges → shapes → faces<\/b>. Unlike classical ML, you don't hand-pick the features.<\/p>\n<ol>\n<li><b>Neurons:<\/b> multiply inputs by weights, add them up, pass through an activation function (like <b>ReLU<\/b>).<\/li>\n<li><b>Layers:<\/b> input layer, hidden layers, output layer.<\/li>\n<li><b>Forward pass:<\/b> data flows through to a prediction.<\/li>\n<li><b>Backpropagation:<\/b> the error is sent backward using calculus (the chain rule) to find each weight's contribution.<\/li>\n<li><b>Gradient descent:<\/b> every weight is nudged to reduce the error; repeat over millions of examples.<\/li>\n<\/ol>\n<table class=\"tbl\"><tr><th>Architecture<\/th><th>Best at<\/th><th>Example use<\/th><\/tr>\n<tr><td>Feed-forward (MLP)<\/td><td>Tabular data<\/td><td>Credit scoring<\/td><\/tr>\n<tr><td>CNN (convolutional)<\/td><td>Images<\/td><td>Photo tagging, medical scans<\/td><\/tr>\n<tr><td>RNN / LSTM<\/td><td>Sequences<\/td><td>Older speech and translation systems<\/td><\/tr>\n<tr><td>Transformer<\/td><td>Language, now images and audio<\/td><td>ChatGPT, Claude, Gemini<\/td><\/tr>\n<tr><td>GAN / diffusion<\/td><td>Generating images<\/td><td>Midjourney, Stable Diffusion<\/td><\/tr><\/table>\n<p><b>Why it took off in the 2010s:<\/b> it needs lots of data and GPU computing power. <b>Milestones:<\/b> backpropagation popularized by Rumelhart, Hinton and Williams (<b>1986<\/b>); <b>AlexNet<\/b> wins ImageNet (<b>2012<\/b>) with 15.3% top-5 error vs 26.2% for second place, trained on 1.2 million labeled photos with GPUs; \"Attention Is All You Need\" introduces the Transformer (<b>2017<\/b>); Hinton and Hopfield win the <b>Nobel Prize in Physics (2024)<\/b>.<\/p>\n\n\n<p><b>Training details to know:<\/b><\/p>\n<ul>\n<li><b>Activation functions<\/b> add non-linearity so networks can learn curves, not just straight lines. <b>ReLU<\/b> outputs the input if positive, otherwise 0 (most common in hidden layers). <b>Sigmoid<\/b> squeezes values to 0–1 (yes/no probability). <b>Softmax<\/b> turns scores into probabilities that add up to 1 across many classes (e.g. which of 1,000 ImageNet classes).<\/li>\n<li><b>Learning rate:<\/b> how big each gradient-descent step is. Too big and training jumps around and never settles; too small and it takes forever.<\/li>\n<li><b>Epoch:<\/b> one full pass through the training data. <b>Batch:<\/b> the small group of examples processed before each weight update.<\/li>\n<li><b>Why GPUs:<\/b> training is mostly huge numbers of matrix multiplications that can run in parallel, which graphics chips do far faster than ordinary processors.<\/li>\n<li><b>Transfer learning and fine-tuning:<\/b> start from a model already trained on a big general dataset (e.g. ImageNet, or a large language model), then train it a little more on your smaller, specific dataset. A hospital can fine-tune a general image model on a few thousand X-rays instead of millions. This is how most real projects and all chat assistants (Topic 4) are built.<\/li>\n<li><b>Black box problem:<\/b> deep networks have millions or billions of weights, so it is hard to explain why they made a decision. <b>Explainable AI (XAI)<\/b> methods try to show which inputs mattered most, which is important in healthcare, lending and law (Topic 11).<\/li>\n<\/ul>\n<h3>3.6 Predictive analytics<\/h3>\n<p><b>What it is.<\/b> Using historical data, statistics and ML to estimate what will happen next. It is the business application of supervised learning.<\/p>\n<table class=\"tbl\"><tr><th>Type<\/th><th>Question<\/th><th>Example<\/th><\/tr>\n<tr><td>Descriptive<\/td><td>What happened?<\/td><td>How many customers left last quarter<\/td><\/tr>\n<tr><td>Diagnostic<\/td><td>Why did it happen?<\/td><td>Customers left after a price increase<\/td><\/tr>\n<tr><td>Predictive<\/td><td>What is likely to happen?<\/td><td>Which customers will leave next month<\/td><\/tr>\n<tr><td>Prescriptive<\/td><td>What should we do?<\/td><td>Offer those customers a discount<\/td><\/tr><\/table>\n<p><b>How it works:<\/b> (1) define one precise question (\"chance each subscriber doesn't renew in 30 days?\"); (2) collect and clean historical data; (3) choose a model: classification for yes/no, regression for amounts, time-series for forecasts; (4) train and test; (5) deploy, act and retrain. <b>Techniques:<\/b> logistic regression, decision trees, random forests, gradient-boosted trees (XGBoost, LightGBM), ARIMA, neural networks.<\/p>\n<p><b>Weakness:<\/b> \"garbage in, garbage out.\" Poor or biased data gives poor predictions, and models trained on the past can fail when the world changes suddenly. <i>Example:<\/i> a subscription company scores weekly churn risk and sends offers only to the highest-risk customers.<\/p>\n\n<h3>3.7 Computer vision<\/h3>\n<p>Teaching computers to understand images and video. Almost all modern vision uses deep learning (CNNs and, more recently, vision transformers). Uses: face unlock, scan reading, factory checks, self-checkout, self-driving cars.<\/p>\n<table class=\"tbl\"><tr><th>Task<\/th><th>Question<\/th><th>Output<\/th><\/tr>\n<tr><td>Image recognition<\/td><td>What is in this picture?<\/td><td>One label (\"dog\")<\/td><\/tr>\n<tr><td>Object detection<\/td><td>What objects, and where?<\/td><td>A box + label per object<\/td><\/tr>\n<tr><td>Segmentation<\/td><td>Which exact pixels belong to each object?<\/td><td>Pixel-level outline<\/td><\/tr>\n<tr><td>Video analysis<\/td><td>What is happening over time?<\/td><td>Tracks, actions, events<\/td><\/tr><\/table>\n<ul>\n<li><b>Recognition:<\/b> a CNN's filters detect edges → textures → parts → objects. Trained on datasets like <b>ImageNet<\/b> (1.2 million photos, 1,000 classes). E.g. searching Google Photos for \"beach.\"<\/li>\n<li><b>Detection:<\/b> must localize (box) and classify (name). Older two-stage R-CNN detectors proposed regions first; <b>YOLO<\/b> (\"You Only Look Once,\" <b>2015<\/b>) predicts all boxes in one pass, fast enough for live video. A photo of three dogs: a classifier gives one label, a detector gives three boxes.<\/li>\n<li><b>Video analysis:<\/b> detect in each frame, then track objects across frames (often with a <b>Kalman filter<\/b>), then recognize actions or count events. E.g. sports player tracking, traffic counting.<\/li>\n<li><b>Limits:<\/b> lighting, angles, underrepresented groups; face recognition raises privacy and surveillance concerns.<\/li>\n<\/ul>\n\n<h3>3.8 Robotics and autonomous systems<\/h3>\n<p>Robotics puts AI into a physical body that senses, decides and acts. An <b>autonomous system<\/b> does this without a human controlling each step (self-driving car, warehouse robot, drone).<\/p>\n<table class=\"tbl\"><tr><th>Robot stack<\/th><th>What happens<\/th><\/tr>\n<tr><td>1. Perceive<\/td><td>Cameras, lidar, radar, touch sensors + computer vision<\/td><\/tr>\n<tr><td>2. Localize &amp; map<\/td><td>Where am I? Often <b>SLAM<\/b> (simultaneous localization and mapping)<\/td><\/tr>\n<tr><td>3. Plan<\/td><td><b>Motion planning:<\/b> a collision-free path. <b>A*<\/b> searches a grid for the shortest route; <b>RRT / RRT*<\/b> grow random trees, good for arms with many joints<\/td><\/tr>\n<tr><td>4. Control<\/td><td>Turn the plan into motor commands hundreds of times a second. <b>PID<\/b> reacts to current error (P), built-up error (I) and how fast error changes (D). Optimal controllers: LQR, MPC<\/td><\/tr>\n<tr><td>5. Learn<\/td><td><b>Imitation learning<\/b> (copy human demos, behavior cloning), <b>RL<\/b> in simulation then <b>sim-to-real<\/b>, and robot <b>foundation models<\/b> (vision-language-action) that follow instructions like \"put the apple in the bowl\"<\/td><\/tr><\/table>\n<p><b>Swarm robotics:<\/b> many simple robots following local rules with no leader (like ants or bird flocks); the group behavior is <b>emergent<\/b>. Harvard's <b>Kilobots<\/b> (2014): 1,024 coin-sized robots (~$20 each), with four \"seed\" robots as a reference, arranged themselves into a star or wrench in about 12 hours using edge-following, gradient counting and neighbor-based localization.<\/p>\n<p><b>Numbers:<\/b> IFR World Robotics 2026 counts a record <b>5 million<\/b> industrial robots in factories in 2025; installations rose 11% to 600,000+; China installed <b>354,000 (59%)<\/b>. Waymo gave ~<b>500,000<\/b> paid driverless rides a week by March 2026, targeting 1 million by end of 2026. <b>Challenges:<\/b> safety around people, unpredictable conditions, cost, and responsibility for mistakes.<\/p>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 3.1 · Supervised, unsupervised or reinforcement? (card sort)<\/b><\/p><p>Sort these: (a) spam filter trained on labeled emails, (b) grouping shoppers into segments, (c) a robot learning to walk by trial and error, (d) predicting house prices, (e) \"customers who bought X also bought Y,\" (f) a game AI that improves by playing itself.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Answers: (a) supervised, (b) unsupervised, (c) reinforcement, (d) supervised (regression), (e) unsupervised (association), (f) reinforcement.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 3.2 · Be the evaluator (pen and paper)<\/b><\/p><p>A spam filter checks 50 emails; 10 are spam. It flags 8 emails, and 6 of those are really spam. Fill in the confusion matrix and calculate precision and recall.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> TP = 6, FP = 2, FN = 4, TN = 38. Precision = 6 ÷ 8 = 75%; recall = 6 ÷ 10 = 60%.<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>ML finds rules from data; the training loop is collect → model → train → test → deploy.<\/li>\n<li>Supervised = labels; unsupervised = no labels (clustering, association, PCA); RL = rewards.<\/li>\n<li>Deep learning stacks layers and learns with backpropagation + gradient descent.<\/li>\n<li>Applications: predictive analytics, computer vision, robotics.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>Feature / label<\/dt><dd>An input variable / the correct answer in training data.<\/dd>\n<dt>Overfitting<\/dt><dd>Memorizing training data instead of learning the general pattern.<\/dd>\n<dt>Loss function<\/dt><dd>A score of how wrong the predictions are.<\/dd>\n<dt>Gradient descent<\/dt><dd>Adjusting parameters step by step to reduce loss.<\/dd>\n<dt>Backpropagation<\/dt><dd>Sending the error backward through a network to update weights.<\/dd>\n<dt>Policy<\/dt><dd>An RL agent's strategy for choosing actions.<\/dd>\n<dt>Bounding box<\/dt><dd>Rectangle marking an object's location in an image.<\/dd>\n<dt>SLAM<\/dt><dd>A robot building a map while tracking its own position.<\/dd>\n<dt>Hyperparameter<\/dt><dd>A setting chosen before training, like the learning rate.<\/dd>\n<dt>Confusion matrix<\/dt><dd>Table of true/false positives and negatives.<\/dd>\n<dt>F1 score<\/dt><dd>One number balancing precision and recall.<\/dd>\n<dt>Underfitting<\/dt><dd>A model too simple to learn the pattern.<\/dd>\n<dt>Cross-validation<\/dt><dd>Rotating which part of the data is used for testing, then averaging.<\/dd>\n<dt>Regularization<\/dt><dd>Penalizing complexity to reduce overfitting.<\/dd>\n<dt>Activation function<\/dt><dd>Non-linear step in a neuron (ReLU, sigmoid, softmax).<\/dd>\n<dt>Epoch<\/dt><dd>One full pass through the training data.<\/dd>\n<dt>Transfer learning<\/dt><dd>Reusing a pretrained model for a new task.<\/dd>\n<dt>Emergent behavior<\/dt><dd>Group behavior arising from simple individual rules.<\/dd>\n<\/dl><\/div>","q":[["mc","Which describes machine learning?",["Answers + rules → data","Only hand-written rules","Data + answers → rules","Rules + data → answers"],2,"ML finds the rules from examples with known answers."],["mc","Who coined the term \"machine learning\" in 1959?",["Lee Sedol","Geoffrey Hinton","Alan Turing","Arthur Samuel"],3,"Arthur Samuel at IBM, with his self-playing checkers program."],["mc","A model scores 99% on training data but poorly on new data. This is called:",["Clustering","Overfitting","Underfitting","Regression"],1,"It memorized the training set instead of learning the pattern."],["mc","Predicting a house price is an example of:",["Regression","Association","Classification","Clustering"],0,"Regression predicts a number; classification predicts a category."],["mc","Grouping shoppers into segments with no labels uses:",["Regression","Supervised learning","Unsupervised learning (clustering)","Reinforcement learning"],2,"Clustering such as k-means finds groups in unlabeled data."],["mc","Precision answers which question?",["How fast is the model?","Of all real spam, how much did we catch?","Of emails flagged as spam, how many really were spam?","How many features are used?"],2,"That's precision. The other one is recall."],["mc","Which data split is used to tune the model?",["Production","Training","Validation","Test"],2,"Training = learn, validation = tune, test = final check on unseen data."],["mc","Which network type is best known for images?",["CNN","BM25","RNN","Feed-forward"],0,"Convolutional neural networks power photo tagging and scan reading."],["mc","\"What should we do?\" is which type of analytics?",["Prescriptive","Descriptive","Diagnostic","Predictive"],0,"Prescriptive analytics recommends actions."],["mc","In computer vision, detection outputs:",["Pixel-level outlines","One label for the whole image","A video timeline","A box + label for each object"],3,"Detection (e.g. YOLO, 2015) draws boxes; segmentation draws pixel outlines."],["mc","In the robotics loop, SLAM answers:",["What path should I take?","How hard should the motor turn?","Where am I?","What should I learn?"],2,"SLAM is localization and mapping."],["mc","In k-means clustering, what happens after each point is assigned to its nearest centroid?",["The model is deployed","k is doubled","The data is labeled by a human","Each centroid moves to the average of its points"],3,"Steps 3–4 (assign, then move centroids) repeat until the groups stop changing."],["mc","Which clustering method does NOT need you to choose k in advance and labels isolated points as noise?",["k-means","DBSCAN","PCA","Apriori"],1,"DBSCAN finds dense regions and marks outliers as noise."],["mc","75% of baskets with bread contain butter, but butter is in 70% of all baskets. What is the lift?",["About 0.75","About 70","About 4","About 1.07"],3,"Lift = confidence ÷ how common B is = 0.75 ÷ 0.70 ≈ 1.07, a weak link."],["mc","A lift of exactly 1 means:",["The rule is always true","No link between A and B","A strongly raises the chance of B","A prevents B"],1,"Lift > 1 means A raises the chance of B; lift = 1 means no link."],["mc","A boat-racing agent spun in circles collecting bonus points instead of finishing. This is:",["Reward hacking","Sim-to-real","Overfitting","Clustering"],0,"The agent found a loophole in its reward."],["mc","How did AlphaGo Zero differ from AlphaGo?",["It learned purely by playing against itself","It played chess instead","It used no neural networks","It used human games only"],0,"It learned with no human games at all."],["mc","In a PID controller, what does the D term react to?",["The current error","How fast the error is changing","The robot's map","Error built up over time"],1,"D is the derivative: \"if I'm about to overshoot, slow down.\""],["mc","Which motion-planning method grows a tree of random sample points and suits arms with many joints?",["A*","Kalman filter","RRT / RRT*","PID"],2,"A* searches a grid for the shortest route; RRT grows random trees."],["mc","What did YOLO (2015) change about object detection?",["It drew pixel outlines","It predicted all boxes and labels in one pass, fast enough for live video","It only worked on text","It needed two stages"],1,"Older R-CNN detectors used two stages."],["mc","Which tool is often used to track an object across video frames by predicting where it moves next?",["Apriori","ReLU","Kalman filter","BM25"],2,"Detection runs per frame; a Kalman filter links objects across frames."],["mc","Linear regression fits which equation?",["y = w·x + b","S-I-F-T","A + B → C","y = x²"],0,"It adjusts weight w and bias b with gradient descent."],["mc","Which of these is a hyperparameter rather than a parameter?",["The learning rate","The bias b in y = w·x + b","A neuron's output","A weight learned in training"],0,"Hyperparameters are chosen before training; parameters are learned."],["mc","A spam filter has TP = 15, FP = 3, FN = 5, TN = 77. What is its precision?",["75%","83%","92%","97%"],1,"Precision = TP ÷ (TP + FP) = 15 ÷ 18 ≈ 83%."],["mc","Using the same numbers (TP = 15, FP = 3, FN = 5, TN = 77), what is the recall?",["20%","92%","75%","83%"],2,"Recall = TP ÷ (TP + FN) = 15 ÷ 20 = 75%."],["mc","Only 1% of payments are fraud. A model always predicts \"not fraud.\" Its accuracy is about:",["50%","1%","0%","99%"],3,"99% accurate but recall is 0: accuracy alone misleads on rare events."],["mc","A model scores poorly on both training and test data. This is:",["Underfitting","Transfer learning","Overfitting","Good fit"],0,"It is too simple to learn the pattern (high bias)."],["mc","Which is NOT a way to reduce overfitting?",["Training for many more epochs after validation error rises","Regularization","Dropout","More varied training data"],0,"Early stopping does the opposite: stop when validation error starts rising."],["mc","A random forest makes predictions by:",["Clustering points with k-means","Fitting a straight line","Many trees trained on random samples that vote","One deep tree"],2,"Averaging many trees makes it accurate and robust."],["mc","Which activation function turns scores into probabilities that add up to 1 across many classes?",["Sigmoid","ReLU","Softmax","PID"],2,"Softmax is used in the output layer for multi-class problems."],["mc","What happens if the learning rate is far too large?",["The model underfits forever","Training jumps around and may never settle","Nothing changes","Training is very slow but accurate"],1,"Too small = very slow; too large = unstable."],["mc","A hospital adapts a general image model using a few thousand X-rays. This is:",["Transfer learning / fine-tuning","Reward hacking","Regression","Clustering"],0,"Reusing a pretrained model saves data and compute."],["mc","Why are GPUs used to train neural networks?",["They label the data","They run huge numbers of matrix multiplications in parallel","They have internet access","They store more files"],1,"Deep learning took off in the 2010s partly because of GPUs."],["tf","\"Deep\" in deep learning means the network has many layers.",true,"Each layer learns a more abstract view: edges → shapes → faces."],["tf","Raising a classifier's threshold usually increases recall.",false,"It usually raises precision and lowers recall."],["tf","AlphaGo beat Lee Sedol 4–1 in 2016 using reinforcement learning.",true,"A classic RL milestone."],["tf","AlexNet was trained on about 1.2 million labeled ImageNet photos using GPUs.",true,"It won ImageNet 2012 with 15.3% top-5 error vs 26.2%."],["tf","Harvard's Kilobots needed a central leader robot to form shapes.",false,"They used only local rules with no leader (emergent behavior), plus four seed robots as a reference point."],["tf","All AI systems in use today are narrow AI.",true,"AGI does not exist yet."],["tf","An epoch is one full pass through the training data.",true,"A batch is the group of examples processed before each update."],["sa","Describe the five steps of the ML training loop.","Collect data (examples) → pick a model (math function with adjustable parameters) → train (predict, score the loss, nudge parameters, repeat) → test on unseen data to catch overfitting → deploy and monitor because real-world data drifts."],["sa","Compare supervised, unsupervised and reinforcement learning, with one example each.","Supervised learns from labeled examples (bank fraud classifier). Unsupervised finds structure without labels (shopper segmentation with k-means). Reinforcement learns by trial, error and reward (AlphaGo; RLHF for chatbots)."],["sa","Explain support, confidence and lift for an association rule {A} → {B}.","Support: how often A and B appear together across all baskets. Confidence: of baskets with A, the share that also contain B. Lift: confidence divided by how common B is anyway; lift > 1 means A really raises the chance of B, lift = 1 means no link."],["sa","Describe the five layers of the robot stack.","Perceive (cameras, lidar, radar + computer vision) → localize and map (SLAM) → plan (motion planning, e.g. A*, RRT) → control (motor commands, e.g. PID) → learn (imitation learning, RL with sim-to-real, robot foundation models)."],["sa","Calculate accuracy, precision and recall for TP = 15, FP = 3, FN = 5, TN = 77, and explain what each tells you.","Accuracy = (15 + 77) ÷ 100 = 92%: share of all predictions that were right. Precision = 15 ÷ 18 ≈ 83%: of emails flagged as spam, how many were spam. Recall = 15 ÷ 20 = 75%: of all real spam, how much was caught. F1 ≈ 0.79 balances precision and recall."],["sa","Explain overfitting and underfitting with an analogy, and give two ways to prevent overfitting.","Underfitting: model too simple, poor on training and test (like not studying). Overfitting: memorizes training data including noise, great on training but poor on new data (like memorizing last year's answers). Prevent with more varied data, regularization, dropout, early stopping, simpler models, or cross-validation to check."]]},{"n":4,"title":"Generative AI & Large Language Models","sum":"The models that write: what generative AI is, how large language models are built and how they produce text, what they can and can't do, and the tools people actually use.","html":"<h3>4.1 What generative AI is<\/h3>\n<p><b>Generative AI<\/b> creates <b>new content<\/b> (text, images, audio, video, code) that looks like the data it learned from. Most earlier ML is <b>predictive<\/b> (or discriminative): it labels or scores existing data, like \"spam / not spam\" or a house price (Topic 3).<\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Predictive AI<\/th><th>Generative AI<\/th><\/tr>\n<tr><td><b>Output<\/b><\/td><td>A label, number or decision<\/td><td>New text, images, audio, video or code<\/td><\/tr>\n<tr><td><b>Example<\/b><\/td><td>Fraud score for a card payment<\/td><td>A written answer, an essay draft, a picture<\/td><\/tr>\n<tr><td><b>Typical models<\/b><\/td><td>Logistic regression, random forests, CNN classifiers<\/td><td>LLMs (Transformers), diffusion models, GANs<\/td><\/tr><\/table>\n<p>How the ideas nest: <b>AI<\/b> ⊃ <b>machine learning<\/b> ⊃ <b>deep learning<\/b> ⊃ <b>generative AI<\/b> ⊃ <b>large language models<\/b>. A <b>large language model (LLM)<\/b> is a generative model for language: a very large Transformer network trained to predict the next token of text.<\/p>\n\n<h3>4.2 Key LLM vocabulary<\/h3>\n<table class=\"tbl\"><tr><th>Term<\/th><th>What it means<\/th><th>Why it matters<\/th><\/tr>\n<tr><td><b>Token<\/b><\/td><td>The unit an LLM reads and writes: a word or part of a word. A common rule of thumb is that 1 token ≈ ¾ of an English word, so 1,000 tokens ≈ 750 words.<\/td><td>Usage limits and prices are counted in tokens.<\/td><\/tr>\n<tr><td><b>Parameters<\/b><\/td><td>The adjustable numbers (weights) inside the network, learned in training. GPT-3 (2020) had 175 billion.<\/td><td>More parameters can store more patterns, but cost more to train and run.<\/td><\/tr>\n<tr><td><b>Context window<\/b><\/td><td>How many tokens the model can take in at once: your prompt, files, the conversation so far and its own reply. Leading models in 2026 handle around 1 million tokens.<\/td><td>It works like short-term memory. Anything outside the window is forgotten, and long inputs are not read equally well (Topic 9, \"Lost in the Middle\").<\/td><\/tr>\n<tr><td><b>Training data<\/b><\/td><td>The huge text collection (web pages, books, code) used in pretraining.<\/td><td>The model's knowledge and its biases come from this data.<\/td><\/tr>\n<tr><td><b>Knowledge cutoff<\/b><\/td><td>The date the training data ends.<\/td><td>Later events are unknown unless the model searches (Topic 9).<\/td><\/tr>\n<tr><td><b>Prompt<\/b><\/td><td>The input instructions and content you give the model.<\/td><td>Clear prompts give better answers (4.9).<\/td><\/tr>\n<tr><td><b>Inference<\/b><\/td><td>Running a trained model to produce an answer.<\/td><td>Every answer has a computing cost, which is why AI answers cost more than a list of links (Topic 12).<\/td><\/tr><\/table>\n\n<h3>4.3 How an LLM is built<\/h3>\n<p><b>Step 1 · Pretraining (self-supervised learning).<\/b> The model reads a huge amount of text and repeatedly guesses the next token, then checks against the real next token. Nobody labels the data: the text itself provides the answers, which is why it is called <b>self-supervised<\/b>. Training uses the same loop as Topic 3: predict → measure loss → backpropagation → gradient descent, repeated over trillions of tokens on thousands of GPUs. The result is a <b>base model<\/b>: it can continue text fluently but doesn't reliably follow instructions or behave helpfully.<\/p>\n<p><b>Step 2 · The Transformer architecture<\/b> (\"Attention Is All You Need,\" Google, 2017):<\/p>\n<ul>\n<li><b>Self-attention:<\/b> for each token, the model scores how relevant every other token is and blends in their information. In \"The animal didn't cross the street because <i>it<\/i> was too tired,\" attention helps link \"it\" to \"animal.\"<\/li>\n<li><b>Parallel processing:<\/b> unlike older RNNs, which read one word at a time, Transformers process all tokens at once. That made training on huge datasets with GPUs practical.<\/li>\n<li><b>Positional information<\/b> is added so the model knows word order.<\/li>\n<li><b>Many stacked layers<\/b> of attention, each building a richer picture of meaning (like the edges → shapes → faces idea in Topic 3).<\/li>\n<\/ul>\n<p><b>Step 3 · Post-training (alignment).<\/b> Turns the base model into a helpful assistant. OpenAI's <b>InstructGPT<\/b> paper (2022) set out the standard three stages:<\/p>\n<ol>\n<li><b>Supervised fine-tuning (SFT) / instruction tuning:<\/b> human writers create good example answers to prompts, and the model is trained to imitate them.<\/li>\n<li><b>Reward model:<\/b> the model writes several answers to each prompt, humans <b>rank<\/b> them, and a separate reward model learns to predict which answers people prefer.<\/li>\n<li><b>Reinforcement learning (PPO):<\/b> the model is tuned to get high scores from the reward model, with a penalty that stops it drifting too far from the SFT model.<\/li>\n<\/ol>\n<div class=\"ex\"><b>Why alignment matters.<\/b> In the InstructGPT study, people preferred answers from the aligned <b>1.3-billion-parameter<\/b> model over the original <b>175-billion-parameter<\/b> GPT-3. Training a model to be helpful mattered more than making it 100× bigger.<\/div>\n<p>Steps 2 and 3 of this recipe are <b>RLHF<\/b> (reinforcement learning from human feedback). Labs also use variations, such as AI feedback guided by a written list of principles. The side effect to remember: because people tend to rate agreeable answers highly, RLHF can teach <b>sycophancy<\/b> (Topic 9).<\/p>\n<p><b>Step 4 · Grounding and tools.<\/b> At answer time, the model can be given retrieved web pages or documents (<b>RAG<\/b>, Topic 7) and tools such as search, a calculator or code. This adds fresh facts and lets it cite sources instead of relying only on memory.<\/p>\n\n<h3>4.4 How an LLM writes an answer<\/h3>\n<ol>\n<li>Your prompt is split into tokens and turned into embeddings (Topic 5).<\/li>\n<li>The Transformer layers process all the tokens and produce a <b>probability for every possible next token<\/b>.<\/li>\n<li>One token is chosen, added to the text, and the process repeats, one token at a time, until the answer ends. This is called <b>autoregressive<\/b> generation.<\/li>\n<\/ol>\n<ul>\n<li><b>Temperature<\/b> controls randomness. Low temperature picks the most likely tokens (focused, repeatable); high temperature picks less likely ones more often (varied, creative, more errors). That's why the same question can get different answers.<\/li>\n<li><b>Key consequence:<\/b> the model picks text that is <b>likely<\/b>, not text that is <b>checked as true<\/b>. A plausible but wrong token sequence looks just as fluent as a correct one, which is the root of hallucination (Topic 8).<\/li>\n<\/ul>\n\n<h3>4.5 Reasoning models<\/h3>\n<p>Newer \"reasoning\" or \"thinking\" models generate a hidden chain of intermediate steps before the final answer (<b>chain-of-thought<\/b>), and spend more computing time per question (<b>test-time compute<\/b>). They are trained, often with reinforcement learning, to work through problems step by step.<\/p>\n<ul>\n<li><b>Better at:<\/b> math, coding, logic puzzles, multi-step planning.<\/li>\n<li><b>Trade-offs:<\/b> slower and more expensive per answer, and still brittle: Apple's GSM-Symbolic study found reasoning models also dropped when irrelevant sentences were added (Topic 9).<\/li>\n<\/ul>\n\n<h3>4.6 Beyond text: images, audio and video<\/h3>\n<ul>\n<li><b>Multimodal models<\/b> take in and produce several types of data: you can show a photo, chart or screenshot and ask about it, talk by voice, or ask for an image. AI Mode queries using voice, images or documents are already 1 in 5 (Topic 1).<\/li>\n<li><b>Diffusion models<\/b> (Stable Diffusion, Midjourney, most video generators): in training, noise is gradually added to real images and the model learns to <b>remove it step by step<\/b>. To create an image, it starts from pure noise and \"denoises\" toward a picture that matches the text prompt.<\/li>\n<li><b>GANs<\/b> (generative adversarial networks, 2014): two networks compete. A <b>generator<\/b> makes fakes and a <b>discriminator<\/b> tries to spot them; each improves the other. Used for early deepfakes and image tools, now largely replaced by diffusion for images.<\/li>\n<\/ul>\n\n<h3>4.7 What generative AI can and can't do<\/h3>\n<table class=\"tbl\"><tr><th>Strong at<\/th><th>Weak at / risky<\/th><\/tr>\n<tr><td>Writing, editing, rewriting in a different tone<\/td><td>Rare, specific facts (hallucination)<\/td><\/tr>\n<tr><td>Summarizing and explaining<\/td><td>Recent events without search (knowledge cutoff)<\/td><\/tr>\n<tr><td>Translating between languages<\/td><td>Exact arithmetic and counting without tools<\/td><\/tr>\n<tr><td>Brainstorming ideas and options<\/td><td>Knowing when it is wrong (overconfidence)<\/td><\/tr>\n<tr><td>Writing and explaining code<\/td><td>Staying neutral when the user pushes (sycophancy)<\/td><\/tr>\n<tr><td>Answering questions in plain language<\/td><td>Very long inputs (lost in the middle); manipulation (prompt injection)<\/td><\/tr><\/table>\n<p>Summary: <b>LLMs learn patterns, not truth.<\/b> Regular patterns (grammar, style, common facts) are learned reliably; rare, arbitrary facts can't be predicted, so the model guesses something plausible.<\/p>\n\n<h3>4.8 Who's playing: the tools people actually use<\/h3>\n<table class=\"tbl\"><tr><th>Tool<\/th><th>Made by<\/th><th>Known for<\/th><\/tr>\n<tr><td>ChatGPT<\/td><td>OpenAI<\/td><td>Leading chatbot; 1B+ weekly users; search, voice, images; ads since 2026<\/td><\/tr>\n<tr><td>Gemini<\/td><td>Google<\/td><td>Powers AI Overviews and AI Mode; built into Android and Google apps<\/td><\/tr>\n<tr><td>Claude<\/td><td>Anthropic<\/td><td>Chat assistant, used heavily for writing and coding<\/td><\/tr>\n<tr><td>Copilot<\/td><td>Microsoft<\/td><td>Built into Windows and Office<\/td><\/tr>\n<tr><td>Perplexity<\/td><td>Perplexity AI<\/td><td>Answer engine with numbered citations<\/td><\/tr>\n<tr><td>Grok<\/td><td>xAI<\/td><td>Chatbot built into X; worst citation accuracy in the Tow test (Topic 7)<\/td><\/tr>\n<tr><td>DeepSeek, Kimi, Qwen<\/td><td>Chinese labs (DeepSeek, Moonshot AI, Alibaba)<\/td><td>Strong open-weight models<\/td><\/tr>\n<tr><td>Midjourney, Stable Diffusion<\/td><td>Midjourney, Stability AI<\/td><td>Image generation (diffusion)<\/td><\/tr><\/table>\n<p><b>Closed vs open-weight models.<\/b> <b>Closed<\/b> models (GPT, Gemini, Claude) are only available through the company's app or API. <b>Open-weight<\/b> models publish their trained parameters, so anyone can download, run and adapt them (e.g. DeepSeek, Kimi, Qwen, Llama, Mistral).<\/p>\n<table class=\"tbl\"><tr><th><\/th><th>Closed<\/th><th>Open-weight<\/th><\/tr>\n<tr><td><b>Pros<\/b><\/td><td>Usually the most capable; managed safety and updates<\/td><td>Cheaper, private (run on your own servers), customizable<\/td><\/tr>\n<tr><td><b>Cons<\/b><\/td><td>Cost, less control, data goes to the provider<\/td><td>Harder to run; safety guardrails can be removed by others<\/td><\/tr><\/table>\n<ul>\n<li>Stanford's 2026 AI Index (as summarized by secondary sources): the top closed model leads the top open one by about <b>3.3%<\/b>, six of the top ten models are closed, and the top four companies are within 25 Elo points on the Arena leaderboard.<\/li>\n<li>Artificial Analysis (April 2026): the leading open-weight models (Kimi K2.6, MiMo V2.5 Pro, DeepSeek V4 Pro) scored within <b>3–6 points<\/b> of the leading proprietary models on its Intelligence Index.<\/li>\n<\/ul>\n\n<h3>4.9 Using generative AI well<\/h3>\n<ul>\n<li><b>Be specific:<\/b> say the task, audience, length and format (\"a 150-word summary for Year 10 students, as 3 bullet points\").<\/li>\n<li><b>Give context and examples:<\/b> paste the source text, or show an example of what you want.<\/li>\n<li><b>Ask for sources<\/b> and check them (SIFT, Topic 8); use search-enabled modes for current facts.<\/li>\n<li><b>Iterate:<\/b> ask follow-ups, request changes, ask it to critique its own answer.<\/li>\n<li><b>Ask neutrally:<\/b> \"What are the strongest arguments against this?\" avoids sycophancy.<\/li>\n<li><b>Don't share<\/b> private or sensitive information you wouldn't want stored (Topic 11).<\/li>\n<\/ul>\n\n<h3>4.10 Adoption, usage and costs<\/h3>\n<ul>\n<li>Generative AI reached <b>53% adoption within three years<\/b>, faster than the PC or the internet (Stanford AI Index 2026).<\/li>\n<li>NBER (2025): ~<b>80%<\/b> of ChatGPT messages are practical guidance, seeking information or writing; <b>70%+<\/b> are non-work; coding is only ~<b>4%<\/b> (more in Topic 10).<\/li>\n<li><b>Environmental cost<\/b> (reported from the 2026 AI Index): AI data-center power capacity reached about <b>29.6 GW<\/b>, comparable to New York State's peak demand, and training one frontier model (xAI's Grok 4) was estimated at about <b>72,816 tonnes of CO₂-equivalent<\/b>. This links to the sustainability principle in Topic 11.<\/li>\n<\/ul>\n\n<div class=\"act\"><h3>Try it yourself<\/h3><div class=\"act-item\"><p class=\"act-t\"><b>Activity 4.1 · Predict the next word<\/b><\/p><p>Write \"The weather today is ___\" and list your top 3 guesses with how likely you think each is. Then ask a chatbot to finish the sentence three times (new chat each time).<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> You just did what an LLM does: rank possible next tokens. Different answers each time show sampling and temperature.<\/p><\/div><div class=\"act-item\"><p class=\"act-t\"><b>Activity 4.2 · Hallucination hunt (try with ChatGPT or another chatbot)<\/b><\/p><p>Ask: \"Give me 3 academic papers about AI tutors in rural schools, with authors and years.\" Then search for each paper.<\/p><p class=\"act-n\"><i>What to notice / answers:<\/i> Count how many really exist. Fabricated sources are a known hallucination type (Topic 8).<\/p><\/div><\/div>\n<div class=\"recap\"><b>Key takeaways<\/b><ul>\n<li>Generative AI creates new content; LLMs are generative models that predict the next token.<\/li>\n<li>Built in stages: pretraining (self-supervised) → Transformer with self-attention → SFT + RLHF → grounding with RAG and tools.<\/li>\n<li>Answers are generated one token at a time by probability, so they are fluent but not automatically true.<\/li>\n<li>Reasoning models think step by step; diffusion models make images by removing noise.<\/li>\n<li>Closed models still lead, but open-weight models are only a few points behind.<\/li><\/ul><\/div>\n\n<div class=\"terms-wrap\"><h3>Key terms<\/h3><dl>\n<dt>Generative AI<\/dt><dd>AI that creates new content rather than labeling data.<\/dd>\n<dt>LLM<\/dt><dd>Large language model: a big Transformer that predicts the next token.<\/dd>\n<dt>Token<\/dt><dd>A word or piece of a word (≈ ¾ of an English word).<\/dd>\n<dt>Parameters<\/dt><dd>The learned weights inside a model.<\/dd>\n<dt>Context window<\/dt><dd>How many tokens the model can consider at once.<\/dd>\n<dt>Self-supervised learning<\/dt><dd>Learning from data that supplies its own answers (the next word).<\/dd>\n<dt>Self-attention<\/dt><dd>Each token weighing how relevant every other token is.<\/dd>\n<dt>Base model<\/dt><dd>A pretrained model before alignment.<\/dd>\n<dt>SFT<\/dt><dd>Supervised fine-tuning on example answers written by people.<\/dd>\n<dt>Reward model<\/dt><dd>A model that predicts which answers humans prefer.<\/dd>\n<dt>Autoregressive<\/dt><dd>Generating one token at a time, each based on the ones before.<\/dd>\n<dt>Temperature<\/dt><dd>A setting controlling how random the token choices are.<\/dd>\n<dt>Open-weight model<\/dt><dd>A model whose trained parameters are published.<\/dd>\n<dt>Diffusion model<\/dt><dd>Image generator that learns to remove noise step by step.<\/dd>\n<dt>GAN<\/dt><dd>Generator and discriminator networks trained against each other.<\/dd>\n<\/dl><\/div>","q":[["mc","What does an LLM learn during pretraining?",["To search the web","To rank websites","To predict the next word (token)","To label images"],2,"Next-token prediction at enormous scale."],["mc","Which 2017 paper introduced the Transformer?",["\"Attention Is All You Need\"","\"Why Language Models Hallucinate\"","\"ImageNet Classification\"","\"Lost in the Middle\""],0,"Attention lets every word relate to every other word."],["mc","In RLHF, what does the reward model learn?",["Grammar rules","Website rankings","Image pixels","Human preferences from ranked answers"],3,"Humans rank answers; the reward model learns those preferences; the LLM is tuned to score well."],["mc","Which model family powers Google AI Overviews and AI Mode?",["Copilot","Gemini","Midjourney","Claude"],1,"Custom Gemini models."],["mc","Why do LLMs often get rare, arbitrary facts wrong?",["They refuse to answer","Such facts can't be predicted from patterns, so the model guesses","They only know images","They are too small"],1,"Patterns are learned reliably; one-off facts are not."],["mc","Midjourney and Stable Diffusion are mainly used for:",["Translation","Web search","Image generation","Spreadsheets"],2,"They are diffusion image generators."],["mc","Which stage of building an LLM feeds fresh sources into the prompt?",["Pretraining","RLHF","Transformer architecture","Grounding with retrieval (RAG)"],3,"Grounding adds evidence so answers aren't only from memory."],["mc","What is the main difference between predictive and generative AI?",["Generative AI is always more accurate","Predictive AI labels or scores data; generative AI creates new content","There is no difference","Predictive AI only works on images"],1,"E.g. fraud score vs a written answer."],["mc","As a rule of thumb, about how many English words are 1,000 tokens?",["100","750","5,000","1,000"],1,"1 token ≈ ¾ of an English word."],["mc","What is a model's context window?",["Its training cutoff date","How many tokens it can consider at once","Its number of users","The app's screen size"],1,"It acts like short-term memory; leading 2026 models reach about 1 million tokens."],["mc","Pretraining is called self-supervised because:",["Humans label every sentence","The text itself supplies the answers (the next word)","The model supervises other models","It uses no data"],1,"No manual labels are needed."],["mc","What does self-attention let a Transformer do?",["Search the web","Generate images from noise","Weigh how relevant every other token is to each token","Read one word at a time"],2,"E.g. linking \"it\" to \"animal\" in a sentence."],["mc","Why were Transformers easier to train at scale than RNNs?",["They don't need data","They process all tokens in parallel","They use fewer GPUs","They read right to left"],1,"Parallel processing suits GPUs."],["mc","What is the correct order of InstructGPT-style post-training?",["Reward model → pretraining → SFT","PPO → reward model → SFT","SFT → reward model → reinforcement learning (PPO)","RAG → SFT → pretraining"],2,"SFT on human-written answers, then a reward model from rankings, then RL."],["mc","In the InstructGPT study, which model did people prefer?",["The aligned 1.3B InstructGPT","Neither","The 175B GPT-3","A diffusion model"],0,"Alignment mattered more than being 100× bigger."],["mc","Generating text one token at a time, each based on the ones before, is called:",["Autoregressive generation","Backpropagation","Diffusion","Clustering"],0,"The model predicts a probability for every possible next token."],["mc","Raising the temperature setting makes an LLM's output:",["Cited","Shorter","Always more accurate","More random and varied"],3,"Low temperature = focused and repeatable."],["mc","Reasoning models improve answers mainly by:",["Working through intermediate steps and spending more compute per question","Skipping pretraining","Using a bigger screen","Removing the Transformer"],0,"Chain-of-thought and test-time compute; slower and costlier."],["mc","How does a diffusion model create an image?",["Two networks vote","It searches the web for images","It copies a stored photo","It starts from noise and removes it step by step toward the prompt"],3,"Training adds noise to images; the model learns to remove it."],["mc","In a GAN, the discriminator's job is to:",["Remove noise","Write captions","Generate images","Spot which images are fake"],3,"The generator and discriminator improve each other."],["mc","What makes a model \"open-weight\"?",["It is free to chat with","It has no safety rules","Its trained parameters are published for anyone to download and run","It was made in a university"],2,"Examples: DeepSeek, Kimi, Qwen, Llama, Mistral."],["mc","Artificial Analysis (April 2026) found leading open-weight models were how far behind the top proprietary models?",["About 50 points","Within 3–6 points","Far ahead","Exactly equal"],1,"On its Intelligence Index."],["tf","RLHF can accidentally reward the model for agreeing with the user.",true,"This is the root of sycophancy (Topic 9)."],["tf","RAG makes a model answer only from its training memory.",false,"RAG adds retrieved sources so answers aren't only from memory."],["tf","About 80% of ChatGPT messages are practical guidance, seeking information or writing.",true,"From the NBER study, 2025."],["tf","A base model straight after pretraining reliably follows instructions like a helpful assistant.",false,"Post-training (SFT + RLHF) turns it into an assistant."],["tf","An LLM chooses text because it is likely, not because it has checked that it is true.",true,"This is the root of hallucination."],["tf","GPT-3 had 175 billion parameters.",true,"Parameters are the learned weights."],["sa","Explain the four stages that turn raw text into a useful AI assistant.","Pretrain on huge text to predict the next token; use the Transformer architecture with attention; align with RLHF (human rankings → reward model → tuning); ground with re
